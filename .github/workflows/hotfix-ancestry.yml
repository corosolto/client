name: hotfix-ancestry-gate

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hotfix-ancestry-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    name: hotfix-ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Guard bot identity
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CSBRASIL_BOT_TOKEN is required to verify hotfix ancestry."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require main-only ancestry for hotfixes targeting main
        run: |
          gh pr view "$PR_NUMBER" --json title,labels,baseRefName,baseRefOid,headRefName,headRefOid,headRepository > /tmp/hotfix-ancestry-pr.json
          python3 scripts/ci/release_policy.py --selftest
          python3 scripts/ci/pr_attestation.py --selftest
          python3 - <<'PY'
          import json, os, subprocess, sys
          pr = json.load(open('/tmp/hotfix-ancestry-pr.json'))
          channel = json.loads(subprocess.check_output([
              'python3', 'scripts/ci/release_policy.py',
          ], input=json.dumps(pr), text=True))
          if not channel['hotfix'] or pr.get('baseRefName') != 'main':
              print('Not a hotfix targeting main; ancestry gate does not apply.')
              raise SystemExit(0)
          payload = {
              'pr': pr,
              'pr_number': int(os.environ['PR_NUMBER']),
              'expected_repository': os.environ['GITHUB_REPOSITORY'],
          }
          attestation = json.loads(subprocess.check_output([
              'python3', 'scripts/ci/pr_attestation.py', '--emit',
          ], input=json.dumps(payload), text=True))
          validated = json.loads(subprocess.check_output([
              'python3', 'scripts/ci/pr_attestation.py', '--apply',
          ], input=json.dumps(dict(payload, attestation=attestation)), text=True))
          if not validated['hotfix_main_only']:
              print('::error::Hotfix must contain the current main as ancestor and no unpublished staging commits. Rebase only the urgent fix onto main.')
              sys.exit(1)
          print('Hotfix ancestry is main-only; complete diff and head/base OIDs are attested.')
          PY
