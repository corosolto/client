# preview-build — COMPILA o preview de PR da VERCEL (aposentado; dispatch só para emergência).
#
# Aposentado em favor do cf-preview (fase 2): o preview de PR agora é Cloudflare.
# Este workflow só roda por `workflow_dispatch` de alguém com write (emergência de
# preview Vercel); nunca mais por push de PR, que era o custo de Build CPU Minutes.
# O desenho de segurança segue o mesmo: este job roda código do PR e NÃO recebe
# segredo nenhum (`pull_request` foi o gatilho que garantia isso; agora é o dispatch
# manual). O que sai daqui é BYTE ESTÁTICO: `.vercel/output` inteiro, que o
# `preview-deploy.yml` (workflow_run, com o token) publica sem executar nada do PR.
name: preview-build

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do PR do qual o preview de emergência é compilado'
        required: true

# Só leitura. Este job não comenta, não rotula e não publica.
permissions:
  contents: read

concurrency:
  group: preview-build-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # O job NÃO se chama `build`: o ruleset da main exige o contexto `build` pelo nome,
  # sem amarrar a workflow, e um segundo `build` aqui contava junto com o do pr-fast.
  preview:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }

      - run: npm ci

      - name: Tags e checksum dos pacotes de assets
        id: packs
        env:
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const saida = [];
          for (const [script, variavel, nome] of [
            ['scripts/fetch-audio.sh', 'AUDIO_PACK_URL', 'audio_tag'],
            ['scripts/fetch-decals.sh', 'DECALS_PACK_URL', 'decals_tag'],
          ]) {
            const fonte = fs.readFileSync(script, 'utf8');
            const url = fonte.match(new RegExp(`URL="\\$\\{${variavel}:-([^}]+)\\}"`))?.[1];
            const tag = url?.match(/\/download\/([^/]+)\//)?.[1];
            if (!tag) throw new Error(`${script}: tag ausente da URL default de ${variavel}`);
            saida.push(`${nome}=${tag}`);
          }
          const sha = process.env.AUDIO_PACK_SHA256 || 'public';
          if (sha !== 'public' && !/^[a-f0-9]{64}$/i.test(sha)) throw new Error('AUDIO_PACK_SHA256 inválido para a chave de cache');
          saida.push(`audio_sha=${sha}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${saida.join('\n')}\n`);
          NODE

      # Sem restore-keys: pack parcial ou de outra tag nunca pode completar o checkout.
      - name: Cache do pacote de áudio por tag e checksum
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: public/audio
          key: audio-pack-${{ steps.packs.outputs.audio_tag }}-${{ steps.packs.outputs.audio_sha }}

      - name: Cache dos decalques por tag exata
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: public/img/decals
          key: decals-pack-${{ steps.packs.outputs.decals_tag }}

      # Os pacotes de asset vêm de release público — sem segredo, e com retry para
      # soluço de rede não virar PR vermelho (é a DG2). O pack público não carrega
      # a ambiência licenciada do Blob; o `fetch-audio.sh` completa os mapas com o
      # hum sintetizado pelo jogo, sem expor credencial nem redistribuir WAV privado.
      - name: Assets
        env:
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
        run: |
          bash scripts/fetch-audio.sh
          bash scripts/fetch-decals.sh
          npm run strip:decalbg
          npm run assert:assets

      - name: Build
        run: npm run build

      # O número do PR viaja junto: o job de deploy roda em `workflow_run`, onde o
      # contexto não sabe de qual PR veio. No dispatch o número vem do input; o SHA é
      # o da ref despachada (a head do PR quando disparado sobre ela).
      - name: Anota o PR
        run: |
          mkdir -p .vercel/output
          echo "${{ inputs.pr_number || github.event.pull_request.number }}" > /tmp/pr-numero.txt
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/pr-sha.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ inputs.pr_number || github.event.pull_request.number }}
          path: |
            .vercel/output
          retention-days: 3
          if-no-files-found: error
          # O `upload-artifact` v4 IGNORA arquivo oculto por padrão, e o build da Vercel
          # é cheio deles: sem isto o `.vc-config.json` de cada função fica de fora e o
          # deploy morre com "Could not load function config".
          include-hidden-files: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-meta-${{ inputs.pr_number || github.event.pull_request.number }}
          path: |
            /tmp/pr-numero.txt
            /tmp/pr-sha.txt
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
