name: smoke-web

on:
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'playwright.smoke.config.mjs'
      - 'tests/smoke/**'
      - '.github/workflows/smoke-web.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4321 >/tmp/csbrasil-dev.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/csbrasil-dev.log
          exit 1
      - name: Run smoke test
        run: npx playwright test --config=playwright.smoke.config.mjs tests/smoke/web-smoke.spec.js tests/smoke/web-assets.spec.js --reporter=list --trace=on --output=test-results
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-web-artifacts
          path: |
            /tmp/csbrasil-dev.log
            test-results
          if-no-files-found: ignore
