# Release automático em LOTE (merge de PR de lote + workflow_dispatch; 13/10 era 2×/dia, antes disso a cada push na main): o BOT é o dono do
# bump de versão — o portão `versao-bumpada` do pr-gates.yml virou só checagem de
# consistência, nenhum PR precisa mais bumpa à mão.
#
# O que este workflow faz, em ordem:
#   1. bump alpha.N -> alpha.N+1 (npm version atualiza package.json E package-lock.json)
#      + public/js/version.js + blocos gerados de docs (a versão mora em bloco gerado
#      do README/comecando — sem rodar o gen-docs aqui, o docs:check do PR seguinte
#      reprova). gen-docs é node puro, não precisa de npm ci.
#   2. commit "chore(release): vX" + tag vX + push.
#   3. GitHub Release com as notas do CHANGELOG (mesma extração do job release do ci.yml).
#
# POR QUE TUDO NUM WORKFLOW SÓ (e não "tag dispara ci.yml que cria o Release que dispara
# o deploy-prod.yml"): evento criado com o GITHUB_TOKEN **não dispara workflow novo** —
# é a proteção anti-recursão do GitHub. O caso alpha.32 está documentado no cabeçalho do
# deploy-prod.yml. A mesma regra trabalha A FAVOR aqui: o push do bot não re-dispara nem
# este workflow nem o build do ci.yml — não existe loop. (A Vercel tem webhook próprio e
# VAI buildar o commit de bump: 2 deploys por merge, inofensivo, o último fica valendo.)
#
# Deploy de produção NÃO passa por aqui: decisão do dono (08/08) é manter o auto-deploy
# da Vercel na main. O deploy-prod.yml continua existindo como caminho manual por tag
# (gh workflow run deploy-prod.yml -f tag=vX) caso o auto-deploy seja desligado de novo.
#
# TREM DE RELEASE (13/10/2026, autorizado pelo dono): era um release por push na main —
# 126 releases para 130 merges em 30 dias. Cada um reescrevia README/AGENTS/ARCH/docs,
# todo PR aberto conflitava e o autofix mergeava a base em cada um (49% dos commits da
# main eram do bot). O trem passou a sair 2×/dia e por workflow_dispatch (hotfix:
# `gh workflow run release.yml`). Só embarca se houver commit novo desde a última tag E o
# pr-fast estiver VERDE na head da main. A Vercel só builda produção em commit
# `chore(release):` (scripts/ci/vercel-ignore.sh) — então produção passa a esperar o CI.
#
# RELEASE EM LOTE (14/10/2026, decisão do dono): horário fixo travava o desenvolvimento —
# o trabalho esperava a janela das 11:41/19:41 em vez de sair quando o lote fechava. Agora
# os PRs se empilham num PR de LOTE e o trem sai quando ESSE PR entra na main: label
# `release`, ou branch de origem `lote-*`, `claude/lote-*` ou `*/lote-*`. O classificador
# adiciona `release` a hotfix que mira `main`, portanto hotfix seguro usa o mesmo trem logo
# após o merge. `gh workflow run release.yml` continua como fallback manual.
#
# POR QUE `push` + API e não `pull_request: [closed]`: no `pull_request` o YAML e o
# checkout vêm do ref refs/pull/N/merge (não da main), PR de fork chega sem os secrets
# (RELEASE_TOKEN, BACKEND_DISPATCH_TOKEN) e o payload não tem `head_commit`, que é o que
# o anti-loop e a concurrency leem; o `pull_request_target`, que teria os secrets, é o
# gatilho que o workflow_security_check.py existe para manter longe. No `push` roda o
# YAML da main, com o checkout da main, e o job `lote` só pergunta à API qual PR trouxe
# o commit (contents/pull-requests: read). O head.ref do PR é texto do autor (fork
# inclusive): vai por env, é comparado em `case` com aspas e nunca é ecoado no log.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

# SEM concurrency no topo: com o gatilho em todo push da main, um grupo único no topo
# deixaria o merge de um PR comum cancelar o trem de um lote que ainda espera o pr-fast.
# O grupo mora nos jobs `embarque` e `bump-tag-release`, que só rodam quando o `lote`
# disse que sai: run de PR comum e o push do bump pelo bot nunca entram no grupo.

permissions:
  contents: write

jobs:
  # Quem dispara o trem. Anti-loop em duas camadas: o `if` abaixo descarta o commit
  # `chore(release):` do bot ANTES de qualquer chamada (o push dele é feito com PAT e
  # dispara `push` de verdade), e o guard do bump-tag-release continua lá embaixo.
  lote:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sai: ${{ steps.lote.outputs.sai }}
    steps:
      - name: o commit veio de um PR de lote?
        id: lote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Lote = label `release` OU branch de origem lote-*, claude/lote-* ou */lote-*.
          e_lote() { [ "$1" = true ] && return 0; case "$2" in lote-*|claude/lote-*|*/lote-*) return 0 ;; esac; return 1; }
          if [ "$EVENTO" = workflow_dispatch ]; then
            echo "workflow_dispatch — sai"; echo "sai=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A associação commit→PR pode chegar alguns segundos depois do push.
          PRS=""
          for _ in 1 2 3 4 5 6; do
            PRS=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                    --jq '.[] | select(.merged_at != null and .base.ref == "main") | "\(.number)\t\(any(.labels[]; .name == "release"))\t\(.head.ref)"')
            [ -n "$PRS" ] && break
            sleep 10
          done
          # Sem PR associado: push direto, ou lote entrado por squash/rebase (o commit da head
          # não é o merge do lote). Avisa alto em vez de parecer "PR comum".
          if [ -z "$PRS" ]; then
            echo "::warning::push $SHA na main sem PR mergeado associado — release não sai. PR de lote entra por merge commit; para soltar agora: gh workflow run release.yml"
          fi
          while IFS=$'\t' read -r NUM ROTULO REF; do
            [ -n "$NUM" ] || continue
            if e_lote "$ROTULO" "$REF"; then
              echo "PR #$NUM é de lote — sai"; echo "sai=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "PR #$NUM não é de lote"
          done <<< "$PRS"
          echo "push sem PR de lote — trem fica na estação"
          echo "sai=false" >> "$GITHUB_OUTPUT"

  # O trem só sai com a main VERDE. Merge de lote com a árvore do pai 2, já verde no ci.yml,
  # embarca na hora (RLS18); senão espera o pr-fast do push do merge, que corre junto com
  # este run, até 25 min. Vermelho, ausente ou lento = este trem não sai; o próximo lote (ou
  # um workflow_dispatch) tenta de novo. Job separado porque o teto de 30 min por job (WT2)
  # vale para os dois.
  embarque:
    needs: lote
    if: needs.lote.outputs.sai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dois lotes quase juntos: o run MAIS NOVO cancela o velho no ar. Como a main é
    # fast-forward-only (ruleset), a head nova sempre contém a velha — o run velho
    # empurrando depois de a main andar é exatamente o "atomic push failed" da .152
    # (03:21 de 18/08): rebase cobre a janela evento→execução, não a janela execução→push.
    # O push do bump pelo bot não pode cancelar o run que ainda cria o Release e avisa o
    # backend (o `lote` já o barra; a expressão fica como segunda trava).
    # O grupo só é `release-main` quando o `lote` disse que sai: run de PR comum ganha grupo
    # próprio e não cancela ninguém mesmo que o GitHub avalie a concurrency de job pulado.
    concurrency:
      group: ${{ needs.lote.outputs.sai == 'true' && 'release-main' || format('release-fora-{0}', github.run_id) }}
      cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      actions: read
      contents: read
    outputs:
      sai: ${{ steps.verde.outputs.sai }}
      # O SHA que o embarque viu verde. O bump publica ESTE, ou outro que ele mesmo
      # reconfira verde; nunca a main que estiver lá na hora (RLS17).
      sha: ${{ steps.verde.outputs.sha }}
    steps:
      - name: main verde e com commit novo?
        id: verde
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          MSG=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)
          case "$MSG" in "chore(release):"*) echo "head já é release — nada novo"; echo "sai=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          # Reaproveita o pr-fast do lote (RLS18): merge de 2 pais com a árvore do pai 2 e ci.yml
          # verde nesse pai. CÓPIA IDÊNTICA no bump-tag-release (a régua compara as duas).
          verde_por_lote() {
            local ARV P1 P2 RESTO ARV2 VERDES
            read -r ARV P1 P2 RESTO <<< "$(gh api "repos/$REPO/git/commits/$1" --jq '"\(.tree.sha) \([.parents[].sha] | join(" "))"' 2>/dev/null || true)"
            [ -n "$ARV" ] && [ -n "$P1" ] && [ -n "$P2" ] && [ -z "$RESTO" ] || return 1
            ARV2=$(gh api "repos/$REPO/git/commits/$P2" --jq .tree.sha 2>/dev/null || true)
            [ "$ARV2" = "$ARV" ] || return 1
            VERDES=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$P2" --json headSha,status,conclusion \
                       --jq "[.[] | select(.headSha == \"$P2\" and .status == \"completed\" and .conclusion == \"success\")] | length" 2>/dev/null || true)
            [ "${VERDES:-0}" -gt 0 ] 2>/dev/null || return 1
            echo "pr-fast verde no lote $P2 e $1 traz exatamente a árvore dele"
          }
          if verde_por_lote "$SHA"; then
            echo "lote já testado — embarca sem esperar o pr-fast do push"; { echo "sai=true"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          for i in $(seq 1 25); do
            LINHA=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --commit "$SHA" --event push \
                      --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$LINHA" in
              "completed success") echo "pr-fast verde em $SHA — embarca"; { echo "sai=true"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "::warning::pr-fast NÃO está verde em $SHA ($LINHA) — trem não sai"; echo "sai=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              ""|"null null")
                # No push do lote o pr-fast deste SHA nasce JUNTO com este run: ainda não
                # listado não é ausente. Dá 5 min para ele aparecer antes de desistir.
                if [ "$i" -ge 5 ]; then echo "::warning::nenhum pr-fast de push para $SHA — trem não sai"; echo "sai=false" >> "$GITHUB_OUTPUT"; exit 0; fi ;;
            esac
            sleep 60
          done
          echo "::warning::pr-fast de $SHA não terminou em 25 min — trem não sai"
          echo "sai=false" >> "$GITHUB_OUTPUT"

  bump-tag-release:
    needs: embarque
    if: needs.embarque.outputs.sai == 'true'
    runs-on: ubuntu-latest
    # 30 (teto da WT2): até 5 bumps de ~1 min mais a espera pelo pr-fast de uma cabeça
    # nova, que o passo corta num prazo próprio de 22 min antes de publicar qualquer coisa.
    timeout-minutes: 30
    # actions: read para reconferir o pr-fast quando a main anda durante o bump.
    permissions:
      actions: read
      contents: write
    # Grupo PRÓPRIO e NUNCA cancelável: o embarque de um lote novo dividindo grupo com este
    # job cancelaria o bump velho no meio do push/tag/Release, deixando tag sem Release e o
    # backend sem aviso. Bump em andamento termina; o próximo espera na fila e refaz o
    # bump sobre a main que o anterior deixou (o laço de tentativas do passo abaixo).
    concurrency:
      group: ${{ needs.embarque.outputs.sai == 'true' && 'release-bump' || format('release-fora-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      # Push do bump autenticado como csbrasil-BOT: o ruleset da main (protecao-main)
      # não permite bypass do github-actions[bot]; o guard "chore(release):" impede o loop do PAT.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }

      # Defesa contra o dia em que alguém trocar GITHUB_TOKEN por PAT (aí o push do bot
      # dispararia este workflow de novo): commit do próprio bot não entra.
      - name: pula se o commit já é do bot de release
        id: guard
        run: |
          if git log -1 --format=%s | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: bump da versão + docs gerados + tag
        if: steps.guard.outputs.skip != 'true'
        env:
          APROVADO: ${{ needs.embarque.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Autoria do bump: assina como csbrasil-deploy-bot quando a conta máquina
          # estiver configurada (variável BOT_GIT_EMAIL com o noreply dela); sem ela,
          # cai no github-actions[bot] de sempre. O avatar do passarinho só aparece se
          # o e-mail bater com uma conta real — bot "de mentira" não tem foto.
          git config user.name "csbrasil-deploy-bot"
          git config user.email "${{ secrets.BOT_GIT_EMAIL || vars.BOT_GIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"
          # O bump inteiro mora numa função porque ele é REFEITO a cada tentativa de push.
          refaz_bump() {
            NEW=$(npm version prerelease --no-git-tag-version)
            V=${NEW#v}
            node -e "
              const fs = require('fs');
              const p = 'public/js/version.js';
              fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace(/VERSION = '[^']*'/, \"VERSION = '$V'\"));
            "
            # SIM_HASH: impressão digital do código que o nó de multiplayer simula. O nó
            # anuncia o do ref que ele vendoriza e o navegador compara com este; release
            # que não toca a simulação mantém o hash e não tira ninguém do MP.
            node scripts/sim-hash.mjs --write
            node scripts/sync-changelog.mjs
            node tools/gen-docs.mjs --release
            # O npm ci do site de docs só repete se o lock dele mudou na main nova.
            LOCK_DOCS_AGORA=$(git hash-object docs/package-lock.json)
            if [ "${LOCK_DOCS:-}" != "$LOCK_DOCS_AGORA" ]; then (cd docs && npm ci); LOCK_DOCS=$LOCK_DOCS_AGORA; fi
            (cd docs && npm run build:site)
            # gen-arch também: o ARCH.md embute a versão do jogo no cabeçalho gerado, e sem
            # regenerá-lo aqui o arch:check reprova o PR SEGUINTE (caso real 08/08: o bump
            # do alpha.38 deixou o ARCH.md em alpha.37 e o PR #94 nasceu vermelho). Os dois
            # geradores são node puro, não precisam de npm ci.
            node tools/gen-arch.mjs --release
            if git ls-remote --exit-code --tags origin "$NEW" > /dev/null 2>&1; then
              echo "::error::tag $NEW já existe no remoto — bump manual necessário."
              exit 1
            fi
            git add package.json package-lock.json public/js/version.js CHANGELOG.md README.md AGENTS.md docs/ public/docs/ tools/eval/ARCH.md tools/eval/README.md
            # O `Agent:` vai explícito — a AF7 cobra os dois trailers em todo commit de
            # workflow desde o #451. O Signed-off-by fica com o `-s` porque o e-mail desta
            # identidade vem de secret (BOT_GIT_EMAIL); grafá-lo na mensagem congelaria o
            # secret no YAML, e o `-s` o grava com a identidade configurada acima.
            git commit -s -m "chore(release): $NEW" \
                       -m "Agent: csbrasil-deploy-bot (release)"
            # Tag ANOTADA + push explícito do ref. `--follow-tags` só sobe tag anotada, e
            # `git tag` sem `-a` cria tag LEVE: o alpha.38 (08/08) nasceu leve, ficou só no
            # runner, e o `gh release create` abortou com "tag exists locally but has not
            # been pushed" (reproduzido em repo bare local: tag leve + --follow-tags = nada
            # no remoto). O ls-remote final é a régua que prova que a tag subiu de verdade.
            git tag -a "$NEW" -m "$NEW"
          }
          # --atomic: OS DOIS REFS SOBEM OU NENHUM SOBE.
          #
          # Sem ele, um `git push` com dois refspecs sobe cada um por conta própria. Foi
          # exatamente assim que a esteira travou em 12/08: entre o rebase (era um
          # `git pull --rebase`, hoje é o reset do laço abaixo) e este push, outro merge entrou na main; o ref `main` foi REJEITADO por
          # não-fast-forward e o ref da TAG subiu do mesmo jeito. Resultado medido:
          # v2.0.0-alpha.92 e v2.0.0-alpha.93 existiam no remoto e NENHUMA das duas estava
          # na história da main, com o package.json parado no .92.
          #
          # E isso não se cura sozinho — piora: todo release seguinte calcula 92+1=93, acha
          # a tag órfã, e sai pelo `ls-remote` acima com "bump manual necessário". Como é
          # ESTE passo que regenera os blocos de docs, o `docs:check` do ci.yml ficou
          # vermelho em todo commit da main junto. Uma causa, dois workflows parados.
          #
          # Com --atomic, main rejeitada = tag não sobe, o job falha limpo, e a próxima
          # execução refaz o mesmo número de versão. A corrida volta a ser retentável em
          # vez de terminal.
          #
          # RETRY LIMITADO (14/10/2026). O --atomic deixa a corrida limpa, mas não a ganha: às
          # 21:46 de 13/10 o run morreu em `! [rejected] main -> main (fetch first)` porque o
          # #857 entrou entre o rebase e o push, e o trem não saiu. Cada tentativa agora traz a
          # main do remoto, volta a árvore para ela (reset + clean; a tag local da tentativa
          # anterior sai) e REFAZ o bump: versão, CHANGELOG, docs, ARCH e commit são todos
          # gerados, então regenerar sobre a main nova é o rebase sem conflito possível. Teto
          # de tentativas, backoff curto, nunca --force; a última falha sai com erro (RLS17).
          # A primeira volta do laço substitui o `git pull --rebase` que vinha antes do bump.
          # SÓ PUBLICA SHA COM PR-FAST VERDE. O embarque aprovou $APROVADO. Se a main andou
          # (antes da primeira volta ou entre duas), a cabeça nova só serve depois de o
          # pr-fast DELA terminar verde; senão nada é publicado e o erro diz por quê.
          [ -n "$APROVADO" ] || { echo "::error::o embarque não passou o SHA aprovado; nada a publicar"; exit 1; }
          # Mesmo critério do embarque (RLS18): cabeça nova que é merge de lote já testado vale
          # sem esperar o push. CÓPIA IDÊNTICA da função do embarque (a régua compara as duas).
          verde_por_lote() {
            local ARV P1 P2 RESTO ARV2 VERDES
            read -r ARV P1 P2 RESTO <<< "$(gh api "repos/$REPO/git/commits/$1" --jq '"\(.tree.sha) \([.parents[].sha] | join(" "))"' 2>/dev/null || true)"
            [ -n "$ARV" ] && [ -n "$P1" ] && [ -n "$P2" ] && [ -z "$RESTO" ] || return 1
            ARV2=$(gh api "repos/$REPO/git/commits/$P2" --jq .tree.sha 2>/dev/null || true)
            [ "$ARV2" = "$ARV" ] || return 1
            VERDES=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$P2" --json headSha,status,conclusion \
                       --jq "[.[] | select(.headSha == \"$P2\" and .status == \"completed\" and .conclusion == \"success\")] | length" 2>/dev/null || true)
            [ "${VERDES:-0}" -gt 0 ] 2>/dev/null || return 1
            echo "pr-fast verde no lote $P2 e $1 traz exatamente a árvore dele"
          }
          PRAZO=$(( $(date +%s) + 22 * 60 ))
          pr_fast_verde() {
            while [ "$(date +%s)" -lt "$PRAZO" ]; do
              LINHA=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --commit "$1" --event push \
                        --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
              case "$LINHA" in
                "completed success") return 0 ;;
                completed*) echo "::warning::pr-fast de $1 terminou $LINHA"; return 1 ;;
              esac
              sleep 30
            done
            return 1
          }
          MAX_TENTATIVAS=5
          for tentativa in $(seq 1 "$MAX_TENTATIVAS"); do
            git fetch origin main
            CABECA=$(git rev-parse origin/main)
            if [ "$CABECA" != "$APROVADO" ]; then
              case "$(git log -1 --format=%s "$CABECA")" in
                "chore(release):"*) echo "::error::a main andou para $CABECA, que já é um commit de release: outro trem saiu, este não publica nada."; exit 1 ;;
              esac
              echo "::warning::a main andou de $APROVADO para $CABECA; confiro o lote dela ou espero o pr-fast da cabeça nova antes de publicar"
              if ! verde_por_lote "$CABECA" && ! pr_fast_verde "$CABECA"; then
                echo "::error::a main andou para $CABECA e o pr-fast dela não ficou verde no prazo: nada foi publicado. O próximo lote (ou gh workflow run release.yml) tenta de novo."
                exit 1
              fi
              APROVADO=$CABECA
            fi
            git reset --hard "$APROVADO"
            git clean -fdq
            [ -z "${NEW:-}" ] || git tag -d "$NEW" 2>/dev/null || true
            refaz_bump
            if git push --atomic origin main "refs/tags/$NEW"; then
              echo "release $NEW empurrado sobre $APROVADO na tentativa $tentativa"
              break
            fi
            if [ "$tentativa" = "$MAX_TENTATIVAS" ]; then
              echo "::error::push do release rejeitado $MAX_TENTATIVAS vezes (a main andou a cada tentativa): nada subiu, o --atomic garante. Rode de novo: gh workflow run release.yml"
              exit 1
            fi
            echo "::warning::push do release rejeitado na tentativa $tentativa (a main andou); confiro a cabeça nova e refaço o bump"
            sleep $((tentativa * 10))
          done
          git ls-remote --exit-code origin "refs/tags/$NEW" > /dev/null

      - name: GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          # RELEASE_TOKEN (PAT da conta csbrasil-deploy-bot) faz o Release sair com
          # nome+foto dela; sem o secret, GITHUB_TOKEN e o autor vira github-actions[bot].
          # A proteção anti-recursão do GitHub NÃO vale para PAT — o guard
          # "chore(release)" lá em cima é o que impede o loop (caso previsto no topo).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --exact-match HEAD)
          T=${TAG#v}
          awk "/^## \[$T\]/{f=1;next}/^## \[/{f=0}f" CHANGELOG.md > release-body.md
          EXTRA=()
          if [ -s release-body.md ]; then
            EXTRA=(--notes "$(cat release-body.md)")
          fi
          # As notas nativas ligam PRs e contribuidores às contas GitHub. O fallback
          # antigo (`git log --oneline`) apagou esse crédito no alpha.47 (BUG-40).
          # Idempotente: este job e o "release" do ci.yml (disparo de tag)
          # correm pela mesma release — quem chega segundo levava 422
          # "tag_name already exists" (alpha.154, 18/08). Existindo, NÃO TOCA:
          # `edit` com --notes do CHANGELOG apagava o "What's Changed" dos
          # colaboradores gerado pelo vencedor (alpha.156-.158, 19/08).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe (vencedor da corrida) — nada a fazer"
            exit 0
          fi
          gh release create "$TAG" --generate-notes "${EXTRA[@]}" --title "CSBR $TAG"

      - name: Avisa o backend do release para reconciliar os nós MP
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::BACKEND_DISPATCH_TOKEN não configurado"; exit 1; }
          SHA="$(git rev-parse HEAD)"
          gh api -X POST repos/corosolto/backend/dispatches \
            -f event_type=client-release -f "client_payload[sha]=$SHA"
