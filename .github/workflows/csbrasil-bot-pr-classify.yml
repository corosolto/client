name: csbrasil-bot-pr-classify

on:
  # `pull_request_target` dispara no PUSH, e o estraga-codigo revisa DEPOIS do push.
  # Sem os gatilhos de review, o rotulador roda cedo demais, não vê o revisor e nunca
  # volta para bloquear a pendência. Medido na PR #373, cujo autor real dos reviews é
  # `estraga-codigo`.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  # Varredura: em PR vindo de FORK, os dois gatilhos de review acima rodam SEM os
  # secrets do repositório (regra do GitHub), e o job abaixo não pode nem se
  # identificar. O sweep roda no contexto base, com token, e reclassifica os PRs
  # abertos pelo `workflow_dispatch` — é o que devolve a cobertura pós-estraga-codigo
  # que os gatilhos de review dão nos PRs de casa.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

# BUG-68: um review com N comentários dispara N gatilhos NO MESMO SEGUNDO; os
# runs paralelos leem a lista antes de qualquer um postar e cada um publica o
# seu (PR #348: 5 idênticos mesmo com dedupe). Serializa por PR: 1 run vivo.
concurrency:
  group: pr-classify-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # PORTÃO QUE NÃO PODE MEDIR NÃO VOTA (mesma regra do #402 para o portão de autoria em
  # clone raso). `pull_request_review` e `pull_request_review_comment` num PR de FORK não
  # recebem secret nenhum: o job não tem como se identificar, falhava no guard e pintava
  # de vermelho um PR cujo autor não tem o que consertar. Medido em 11 dos 14 PRs de fork
  # dos últimos 29 - e em 0 dos 15 de casa. O run de `pull_request_target` do MESMO commit
  # passa e é ele que vale; para o resto, o sweep de meia em meia hora cobre.
  classify:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Sem fallback: comentário nascido como github-actions[bot] é o defeito
      # da PR #348 (5 idênticos) — sem o secret o job falha alto na cara.
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      DESIRED_BASE_BRANCH: ${{ vars.PR_DEFAULT_BASE_BRANCH || 'staging' }}
    steps:
      - name: Guard de identidade
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CSBRASIL_BOT_TOKEN ausente — crie o secret (PAT da conta csbrasil-bot, scopes: repo/workflow). Sem ele o classify posta como github-actions[bot] ou não posta."
            exit 1
          fi
      # Leve (CL1): o job só roda scripts/ci/*.py e `git ls-remote`; o resto vem da API.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Ensure labels exist
        run: python3 scripts/ci/ensure_labels.py safe-automerge needs-staging needs-human-gameplay needs-human-backend target:main target:staging target:release needs-estragacodigo-resolution estragacodigo-resolved
      - name: Fetch PR metadata
        run: gh pr view "$PR_NUMBER" --json files,additions,deletions,changedFiles,baseRefName,headRefOid,author,assignees > /tmp/pr.json
      - name: Route PR and set assignee
        run: |
          python3 - <<'PY'
          import json, pathlib
          pr = json.load(open('/tmp/pr.json'))
          payload = {'pr': pr, 'desired_base': '${{ env.DESIRED_BASE_BRANCH }}'}
          pathlib.Path('/tmp/pr-route-input.json').write_text(json.dumps(payload))
          PY
          python3 scripts/ci/pr_route.py < /tmp/pr-route-input.json > /tmp/pr-route.json
          python3 - <<'PY'
          import json, os, re, subprocess
          from scripts.ci.pr_route import target_label
          route = json.load(open('/tmp/pr-route.json'))
          pr = json.load(open('/tmp/pr.json'))
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['GITHUB_REPOSITORY']
          # REST puro: `gh pr edit` resolve nó de user/org via GraphQL e exige
          # scope read:org — PAT com repo/workflow morre aqui (vermelho da #350).
          if route.get('retarget_to'):
              desired = route['retarget_to']
              desired_ref = f'refs/heads/{desired}'
              exists = subprocess.run(
                  ['git', 'ls-remote', '--exit-code', '--heads', 'origin', desired_ref],
                  capture_output=True, text=True,
              )
              if exists.returncode == 0:
                  remote = exists.stdout.split()
                  head_oid = pr.get('headRefOid')
                  if (len(remote) != 2 or remote[1] != desired_ref
                      or not re.fullmatch(r'[0-9a-f]{40}', remote[0])
                      or not re.fullmatch(r'[0-9a-f]{40}', head_oid or '')):
                      raise RuntimeError('routing requires exact desired ref and canonical head OIDs')
                  if remote[0] == head_oid:
                      route.update(retarget_to=None, effective_base=pr['baseRefName'],
                                   target_label=target_label(pr['baseRefName']),
                                   retarget_reason='desired-base-same-head',
                                   retarget_evidence={'desired_ref': desired_ref, 'desired_oid': remote[0], 'head_oid': head_oid})
                      open('/tmp/pr-route.json', 'w').write(json.dumps(route))
                      print(f"Routing no-op: {desired_ref} already points at head {head_oid}; keeping {pr['baseRefName']}")
                  else:
                      subprocess.run(['gh', 'api', '-X', 'PATCH', f'repos/{repo}/pulls/{pr_number}', '--input', '-'],
                                     input=json.dumps({'base': desired}), text=True, check=True)
              else:
                  route['retarget_to'] = None
                  open('/tmp/pr-route.json', 'w').write(json.dumps(route))
          if route.get('add_assignee'):
              subprocess.run(['gh', 'api', '-X', 'POST', f'repos/{repo}/issues/{pr_number}/assignees', '--input', '-'],
                             input=json.dumps({'assignees': [route['add_assignee']]}), text=True, check=True)
          PY
      - name: Refresh PR metadata after routing
        run: gh pr view "$PR_NUMBER" --json files,additions,deletions,changedFiles,baseRefName,author,assignees > /tmp/pr.json
      - name: Classify PR
        run: |
          python3 scripts/ci/pr_classify.py --selftest
          python3 scripts/ci/pr_classify.py < /tmp/pr.json > /tmp/pr-labels.json
      - name: Gate on estraga-codigo review
        env:
          NEW_ESTRAGACODIGO_REVIEW: ${{ github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.user.login == 'estraga-codigo' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          number = os.environ['PR_NUMBER']
          path = '/tmp/pr-estragacodigo.json'
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          def api_pages(endpoint):
              pages = json.loads(subprocess.check_output([
                  'gh', 'api', '--paginate', '--slurp', endpoint,
              ], text=True))
              return [item for page in pages for item in page]
          pr = api(f'repos/{repo}/pulls/{number}')
          requests = api(f'repos/{repo}/pulls/{number}/requested_reviewers')
          payload = {
              'headRefOid': (pr.get('head') or {}).get('sha'),
              'reviewRequests': [
                  {'login': user.get('login')}
                  for user in requests.get('users') or []
              ],
              'reviews': [
                  {
                      'author': {'login': (review.get('user') or {}).get('login')},
                      'state': review.get('state'),
                      'commit': {'oid': review.get('commit_id')},
                      'submittedAt': review.get('submitted_at'),
                  }
                  for review in api_pages(f'repos/{repo}/pulls/{number}/reviews?per_page=100')
              ],
              'labels': [
                  {'name': label.get('name')}
                  for label in pr.get('labels') or []
              ],
          }
          checks = json.loads(subprocess.check_output([
              'gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{payload['headRefOid']}/check-runs?per_page=100",
          ], text=True)).get('check_runs') or []
          payload['statusCheckRollup'] = [
              {'__typename': 'CheckRun', 'name': check.get('name')}
              for check in checks
          ]
          payload['new_estragacodigo_review'] = os.environ.get('NEW_ESTRAGACODIGO_REVIEW') == 'true'
          labels = {label.get('name') for label in payload.get('labels') or []}
          if 'estragacodigo-resolved' in labels:
              pages = json.loads(subprocess.check_output([
                  'gh', 'api', '--paginate', '--slurp',
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/events?per_page=100",
              ], text=True))
              applied = [
                  event.get('created_at') or ''
                  for page in pages for event in page
                  if event.get('event') == 'labeled'
                  and (event.get('label') or {}).get('name') == 'estragacodigo-resolved'
              ]
              payload['estragacodigo_resolved_at'] = max(applied, default='')
          open(path, 'w').write(json.dumps(payload))
          PY
          python3 scripts/ci/estragacodigo_gate.py --selftest
          python3 scripts/ci/estragacodigo_gate.py < /tmp/pr-estragacodigo.json > /tmp/pr-estragacodigo-labels.json
      - name: Apply labels
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.load(open('/tmp/pr-labels.json'))
          review_gate = json.load(open('/tmp/pr-estragacodigo-labels.json'))
          add = sorted(set(data.get('labels_add', []) + review_gate.get('labels_add', [])))
          remove = sorted(set(data.get('labels_remove', []) + review_gate.get('labels_remove', [])))
          repo = os.environ['GITHUB_REPOSITORY']
          n = os.environ['PR_NUMBER']
          if add:
              subprocess.run(['gh', 'api', '-X', 'POST', f'repos/{repo}/issues/{n}/labels', '--input', '-'],
                             input=json.dumps({'labels': add}), text=True, check=True)
          for lab in remove:
              import urllib.parse
              subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/{repo}/issues/{n}/labels/{urllib.parse.quote(lab)}'], check=False)
          PY
      - name: Request estraga-codigo review
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          gate = json.load(open('/tmp/pr-estragacodigo-labels.json'))
          if gate.get('request_review'):
              subprocess.run([
                  'gh', 'api', '-X', 'POST',
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/requested_reviewers",
                  '--input', '-',
              ], input=json.dumps({'reviewers': ['estraga-codigo']}), text=True, check=True)
          PY
      - name: Update bot classification comment
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          pr = json.load(open('/tmp/pr.json'))
          labels = json.load(open('/tmp/pr-labels.json'))
          route = json.load(open('/tmp/pr-route.json'))
          review_gate = json.load(open('/tmp/pr-estragacodigo-labels.json'))
          payload = {
              # Sem `or []`: `files: null` (PR grande demais para a API) precisa chegar
              # NULO no pr_comment.py, que declara a lista incompleta em vez de fingir
              # que o PR não mudou nada.
              'files': pr.get('files'),
              'changedFiles': pr.get('changedFiles'),
              'labels_add': sorted(set(labels.get('labels_add', []) + review_gate.get('labels_add', []))),
              'baseRefName': pr.get('baseRefName'),
              'author_login': ((pr.get('author') or {}).get('login')),
              'add_assignee': route.get('add_assignee'),
              'retarget_to': route.get('retarget_to'),
          }
          pathlib.Path('/tmp/pr-comment-payload.json').write_text(json.dumps(payload))
          PY
          python3 scripts/ci/pr_comment.py --selftest
          python3 scripts/ci/pr_comment.py < /tmp/pr-comment-payload.json > /tmp/pr-comment.md
          python3 - <<'PY'
          import json, os, subprocess
          marker = '## csbrasil-bot classification'
          # BUG-56: casar por AUTOR não vale — sem CSBRASIL_BOT_TOKEN o comentário
          # sai como github-actions[bot], o filtro nunca casa e cada gatilho posta
          # um NOVO (PR #348 chegou a 5 idênticos). O marcador no corpo é a
          # identidade; extras são deletados e o primeiro é atualizado.
          comments = json.loads(subprocess.check_output([
              'gh', 'api', f"repos/${{ github.repository }}/issues/{os.environ['PR_NUMBER']}/comments?per_page=100"
          ], text=True))
          body = open('/tmp/pr-comment.md').read()
          meus = [c for c in comments if marker in c.get('body', '')]
          for c in meus[1:]:
              subprocess.run(['gh', 'api', '-X', 'DELETE', f"repos/${{ github.repository }}/issues/comments/{c['id']}"], check=False)
          if meus:
              subprocess.run(['gh', 'api', f"repos/${{ github.repository }}/issues/comments/{meus[0]['id']}", '-X', 'PATCH', '-f', f'body={body}'], check=True)
              raise SystemExit(0)
          subprocess.run(['gh', 'api', '-X', 'POST', f"repos/${{ github.repository }}/issues/{os.environ['PR_NUMBER']}/comments", '--input', '-'],
                         input=json.dumps({'body': body}), text=True, check=True)
          PY

  # Reclassifica os PRs abertos pelo caminho que TEM secret. Idempotente: o classify
  # dedupe rótulo e comentário, então rodar de novo não polui o PR.
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Guard de identidade
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CSBRASIL_BOT_TOKEN ausente — o sweep precisa do PAT para disparar o classify."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Dispara o classify de cada PR aberto
        run: |
          # Só quem mexeu na última hora e meia (o sweep roda a cada 30 min). Reclassificar os
          # 50 PRs abertos 48×/dia era ~2.400 disparos por dia para quase nenhuma mudança —
          # o PR parado já foi classificado no último evento dele.
          DESDE=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for pr in $(gh pr list --repo "$REPO" --state open --limit 50 --json number,updatedAt \
                        --jq ".[] | select(.updatedAt >= \"$DESDE\") | .number"); do
            gh workflow run csbrasil-bot-pr-classify.yml --repo "$REPO" -f pr_number="$pr" \
              || echo "::warning::não deu para reclassificar o PR #$pr"
          done
