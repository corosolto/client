# portao-browser — O PORTÃO LENTO, o de NAVEGADOR.
#
# POR QUE ESTE ARQUIVO EXISTE (issue #83)
#   O `check:fast` e o ci.yml (pr-fast) rodam TODAS as réguas em node puro. E o que
#   roda em node é cego para o que os GLB fazem: os barracos da Quebrada, as empenas
#   da Brasília e as fachadas do Ferro Velho não existem fora do navegador, então
#   `decal-probe` jurava 334 peças enquanto o dono via 12,7% de parede pintada — 238
#   decalques morrendo calados, uma classe inteira de defeito SEM PORTÃO. As réguas
#   que enxergam isso (`eval:grafite`, `eval:select`) existem, exigem servidor no ar
#   + Chrome + WebGL, e por isso ficaram FORA do portão. Este workflow é esse portão.
#
# POR QUE SEPARADO E NÃO DENTRO DO ci.yml
#   SwiftShader (render por software, o que roda no CI) faz o jogo a ~0,3 FPS e cada
#   mapa custa minutos (ver docs/docs/instrumentacao-ai.md). Juntar com o pr-fast
#   tornaria lento o portão que precisa ser rápido. Aqui é o portão LENTO: roda na
#   `main` e só em PR que toque o que ele carrega (o job `decide`, com o padrão em
#   scripts/ci/gatilho.mjs), como o smoke-web.yml faz para as rotas do site.
#
# O QUE ELE PROVA
#   · eval:grafite-atual — arte única, suporte e zonas autorizadas nos 14 mapas;
#                         o censo histórico continua disponível para auditoria.
#   · eval:select   — a silhueta/pose da tela de seleção contra os personagens elogiados.
#   · entrada, armas, boot e ops no mesmo job; a criação do Sertão no job `sertao`, em
#     paralelo (era o passo mais caro).
#   Em falha: anexa os JSON (número) e roda eval:grafite:ar --fotos (imagem do porquê).
name: portao-browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Mesmo defeito que o ci.yml tinha: com `github.ref` a chave virava
# `refs/heads/main` em todo push da main, um grupo só para a branch inteira, e o
# portão LENTO era o mais penalizado (20 de 29 runs de push na main cancelados —
# 45 min de render por software jogados fora e nenhum veredito). Por commit na
# main, por PR no pull_request.
concurrency:
  group: portao-browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # O FILTRO. Era o `paths:` do `on:`, que deixou 13 PRs de jogo sem portão em 48 h
  # (lista por arquivo que ninguém atualizava), não deixava check quando não casava e
  # o GitHub ignora em PR com mais de 300 arquivos. Agora o padrão mora em
  # scripts/ci/gatilho.mjs (fonte única, medida pela eval:portaogatilho) e o pulo
  # aparece como SKIPPED, que o check_automerge aceita. Falha FECHADO: push, dispatch,
  # erro de diff ou do gatilho = roda. Só `rodar=false` exato pula.
  decide:
    runs-on: ubuntu-latest
    # 15 e não 5: o checkout com histórico (filter blob:none) deste repo passou de 5 min
    # em runner lento e o job morria em "operation was canceled" antes de medir (PR #1130).
    timeout-minutes: 15
    outputs:
      rodar: ${{ steps.filtro.outputs.rodar }}
    steps:
      # Leve: só árvore e commits; os blobs vêm sob demanda (o package.json, se mudou).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
      - name: O PR toca o que portao mede?
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" != "pull_request" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "$EVENTO: roda sempre"; exit 0
          fi
          # -z e quotePath=false: nome com acento sai cru, não entre aspas em octal (que
          # não casaria com nada e pularia o job). A lista vai separada por NUL.
          if ! git -c core.quotePath=false diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/arquivos.txt"; then
            echo "::warning::git diff falhou: sem saber o que mudou, portao roda"
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$(tr -cd '\0' < "$RUNNER_TEMP/arquivos.txt" | wc -c) arquivo(s) no diff"
          node scripts/ci/gatilho.mjs portao < "$RUNNER_TEMP/arquivos.txt" > "$RUNNER_TEMP/veredito.txt" \
            || echo "rodar=true" > "$RUNNER_TEMP/veredito.txt"
          if grep -qx 'rodar=false' "$RUNNER_TEMP/veredito.txt"; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  portao:
    needs: decide
    if: needs.decide.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    # SwiftShader renderiza o contrato nominal dos 14 mapas e a seleção;
    # o teto de 45 min continua limitando o job.
    timeout-minutes: 45
    env:
      BASE: http://localhost:8123
      # Os arnêses de navegador importam o Playwright do root GLOBAL (npm root -g) e
      # dirigem o Chromium por CHROME_BIN; PLAYWRIGHT_BROWSERS_PATH fixa onde ele instala.
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decalques públicos completos antes do navegador
        run: |
          bash scripts/fetch-decals.sh
          node tools/eval/assets-check.mjs --so=decals

      # graffiti-census/graffiti-audit/select-inflate fazem `import(npm root -g +
      # /playwright/index.js)`: o Playwright precisa existir no GLOBAL, na mesma versão
      # do devDependency, não só no node_modules local.
      - name: Playwright global (mesma versão do devDependency)
        run: npm i -g "playwright@$(node -pe "require('./package.json').devDependencies.playwright.replace(/^[^0-9]*/,'')")"

      - name: Instala Chromium + libs do sistema
        run: npx playwright install --with-deps chromium

      # Quem sabe onde o binário caiu é o próprio Playwright: o layout da pasta muda entre
      # versões (chrome-linux -> chrome-linux64) e um glob que não casa vira string vazia
      # sem derrubar o `echo` — CHROME_BIN saía vazio e a régua caía no canal 'chrome',
      # procurando o Chrome do macOS num runner Linux. Aqui falha alto em vez de degradar.
      - name: Resolve CHROME_BIN (Chromium do Playwright)
        run: |
          BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$BIN" || { echo "CHROME_BIN não resolveu para um executável: [$BIN]"; exit 1; }
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Sobe o eval:serve em background
        run: npm run eval:serve >/tmp/eval-serve.log 2>&1 &

      - name: Espera o servidor responder
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8123/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eval-serve.log
          exit 1

      - name: Fauna curada — GLBs, texturas decodificadas e rig dos cinco mapas
        if: ${{ !cancelled() }}
        run: npm run eval:map-fauna-curated:runtime

      - name: Guarda captura e auditoria runtime da fauna
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map-fauna-curated
          path: artifacts/map-fauna-curated/
          if-no-files-found: error

      # Contrato vigente: 14 nominais completos, sem meta histórica de saturação.
      - name: eval:grafite-atual (arte única e suporte real, 14 mapas)
        run: npm run eval:grafite-atual

      - name: Guarda o contrato atual de grafite
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grafite-atual
          path: artifacts/grafite-atual/
          if-no-files-found: warn

      # Roda mesmo com o grafite vermelho: são réguas independentes, e com o `success()`
      # padrão uma regressão de silhueta ficaria invisível justo quando já há falha.
      # `!cancelled()` e não `always()` — corrida cancelada deve parar de verdade.
      - name: eval:select (silhueta da tela de seleção)
        if: ${{ !cancelled() }}
        run: npm run eval:select

      - name: Pegada do lobby nos 11 casos públicos
        if: ${{ !cancelled() }}
        run: npm run eval:lobbyarmamao

      - name: Mira1P da AK pública
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          npm run eval:mira-public

      - name: Guarda a medição da mira pública
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mira-public
          path: artifacts/mira-public.json
          if-no-files-found: warn

      # A porta de entrada do funil: o gesto que tira a splash não pode apertar o menu
      # por baixo (medido no runner do #368 — ver tools/eval/entrada-check.mjs).
      - name: eval:entrada (o gesto que entra não aperta botão do menu)
        if: ${{ !cancelled() }}
        run: npm run eval:entrada

      # Perfil móvel real: toque/coarse entra leve antes do primeiro GLB e continua leve
      # dentro da partida. O mutante prova que a régua acusa quando main.js deixa de ligá-lo.
      - name: eval:perfilmobile:browser (perfil leve desde o boot)
        if: ${{ !cancelled() }}
        run: npm run eval:perfilmobile:browser

      - name: Controles mobile sem disparo involuntário e câmera por toque
        if: ${{ !cancelled() }}
        run: npm run eval:toquecontroles

      - name: Todas as armas com mãos e rastro no cano em mobile e desktop
        if: ${{ !cancelled() }}
        env:
          VM_PUBLIC_ASSETS: https://www.corosolto.com.br
        run: npm run eval:vm-maos-mobile-desktop

      # A partida carrega as armas DELA e nenhum bot empunha caixa (medido no navegador).
      - name: eval:armas (preload de arma por partida)
        if: ${{ !cancelled() }}
        run: npm run eval:armas

      # Vitrine SKINS NOVAS no JOGAR: some com a loja fora, não baixa vídeo no boot, não move o JOGAR.
      - name: eval:treta-vitrine (vitrine da loja no menu principal)
        if: ${{ !cancelled() }}
        env:
          OUT: /tmp/treta-vitrine
        run: node tools/eval/treta-vitrine-browser.mjs

      # O main.js AVALIA? B1–B7 do boot-check com o Chromium do runner (sobe o astro dev sozinho).
      - name: eval:boot (o main.js terminou de avaliar; falha de entrada recupera)
        if: ${{ !cancelled() }}
        env:
          BASE: ''
        run: npm run eval:boot

      # As provas de navegador da camada operacional: boot provado + ops.js lido, TDZ vira
      # crítico, e a sonda barra POST/beacon (o contrato "só lê"). Sem Playwright são puladas.
      - name: ops:selftest — cenários de navegador
        if: ${{ !cancelled() }}
        run: node tools/ops/selftest.mjs --so=navegador
      # Número diz que caiu; imagem diz por quê. Só quando algum passo acima reprova.
      - name: Fotos das piores células (só em falha)
        if: failure()
        env:
          JSON: '1'
        run: npm run eval:grafite:ar -- --fotos 6 || true

      - name: Anexa capturas e números da falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portao-browser-artifacts
          path: |
            tools/eval/graffiti_census.json
            tools/eval/graffiti_audit.json
            tools/eval/select_inflate.json
            /tmp/graffiti-audit/**
            /tmp/eval-serve.log
            /tmp/treta-vitrine/**
          if-no-files-found: ignore

  # O SERTÃO EM JOB PRÓPRIO (14/10/2026). Era o passo mais caro do portão: 8,7 a 12,9 min
  # de um job de 18,7 a 27,7 min (4 runs verdes de 13/10). Em paralelo com o resto, o
  # relógio de parede do portão cai para o maior dos dois (~15 min). Mesmo passo, mesmo
  # servidor (eval:serve na 8123), mesmo Chromium; o teste em
  # tools/ops/tests/workflows.test.mjs cobra que nenhum passo saiu e que ele não espera
  # o job `portao`.
  sertao:
    needs: decide
    if: needs.decide.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: http://localhost:8123
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instala Chromium + libs do sistema
        run: npx playwright install --with-deps chromium

      - name: Resolve CHROME_BIN (Chromium do Playwright)
        run: |
          BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$BIN" || { echo "CHROME_BIN não resolveu para um executável: [$BIN]"; exit 1; }
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Sobe o eval:serve em background
        run: npm run eval:serve >/tmp/eval-serve.log 2>&1 &

      - name: Espera o servidor responder
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8123/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eval-serve.log
          exit 1

      - name: Criação do Sertão (GLBs servidos, caminhada, percurso e contato)
        run: npm run eval:sertao-livestock-runtime

      - name: Evidência visual da criação do Sertão
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sertao-livestock-runtime
          path: artifacts/sertao-astra/livestock-runtime/
          if-no-files-found: warn

      - name: Log do servidor (só em falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portao-sertao-serve-log
          path: /tmp/eval-serve.log
          if-no-files-found: ignore
