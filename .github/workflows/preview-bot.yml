# Código de fork só recebe segredos depois de um mantenedor aprovar o SHA atual.
# Todo push revoga o label; a próxima revisão precisa aplicá-lo novamente.
name: preview-bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  avaliar:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: revoga aprovação quando o SHA muda
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --remove-label "preview-autorizado" 2>/dev/null || true

      # O job `preview` abaixo só dispara em `labeled` com esta etiqueta. Ela nunca foi
      # criada no repositório, então o caminho inteiro era código morto: o bot pedia um
      # rótulo que ninguém tinha como aplicar. Criar aqui é o que liga o mecanismo.
      - name: garante a etiqueta que autoriza o preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ensure_labels.py preview-autorizado

      - name: classifica o diff sem executar código do fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename + " +" + (.additions|tostring) + " -" + (.deletions|tostring)' > /tmp/arquivos.txt
          TOTAL=$(gh api "repos/$REPO/pulls/$PR" --jq '.additions + .deletions')
          PERIGO=$(grep -cE '^\.github/|^scripts/|^package(-lock)?\.json|^vercel\.json|^src/pages/api/|^supabase/|^\.env' /tmp/arquivos.txt || true)
          if [ "$PERIGO" -gt 0 ] || [ "$TOTAL" -gt 3000 ]; then
            TEXTO="área sensível ou diff grande; revisão manual obrigatória"
          else
            TEXTO="candidato a preview; um mantenedor deve revisar o SHA e aplicar o label"
          fi
          gh pr comment "$PR" --repo "$REPO" --body "🤖 **cs-brasil-ai-bot**: $TEXTO \`preview-autorizado\`."

# O JOB `preview` SAIU DAQUI (22/08). Ele publicava com `vercel build`, ou seja,
# executava o build do fork com o VERCEL_TOKEN no ambiente — e era por isso que
# exigia um mantenedor aprovar cada push. O preview agora é feito em duas metades
# que não precisam de aprovação nenhuma: `preview-build.yml` compila o código do
# fork SEM segredo, e `preview-deploy.yml` publica COM segredo sem executar nada
# do PR. Este arquivo ficou só com a classificação do diff, que continua útil.
