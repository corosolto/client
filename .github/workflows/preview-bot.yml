# Código de fork só recebe segredos depois de um mantenedor aprovar o SHA atual.
# Todo push revoga o label; a próxima revisão precisa aplicá-lo novamente.
name: preview-bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  avaliar:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: revoga aprovação quando o SHA muda
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --remove-label "preview-autorizado" 2>/dev/null || true

      # Classificação do diff para o revisor (área sensível ou diff grande). Não
      # promete preview: o de PR é Cloudflare (cf-preview.yml) e o da Vercel virou
      # emergência por dispatch.
      - name: classifica o diff sem executar código do fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename + " +" + (.additions|tostring) + " -" + (.deletions|tostring)' > /tmp/arquivos.txt
          TOTAL=$(gh api "repos/$REPO/pulls/$PR" --jq '.additions + .deletions')
          PERIGO=$(grep -cE '^\.github/|^scripts/|^package(-lock)?\.json|^vercel\.json|^src/pages/api/|^supabase/|^\.env' /tmp/arquivos.txt || true)
          if [ "$PERIGO" -gt 0 ] || [ "$TOTAL" -gt 3000 ]; then
            TEXTO="sensitive area or large diff; manual review is required"
          else
            TEXTO="fork PR gets no preview URL: in-repo PR previews are Cloudflare (cf-preview.yml); Vercel preview is dispatch-only emergency"
          fi
          gh pr comment "$PR" --repo "$REPO" --body "🤖 **cs-brasil-ai-bot**: $TEXTO."

# O JOB `preview` SAIU DAQUI (22/08) e o par Vercel foi aposentado (10/11, fase 2):
# o preview de PR é `cf-preview.yml` (Cloudflare). `preview-build.yml`/`preview-deploy.yml`
# ficam só para emergência, por `workflow_dispatch`. Este arquivo ficou com a
# classificação do diff, que continua útil. O label `preview-autorizado` não gatinga
# nada desde 22/08; a revogação acima é só higiene até o label ser removido do repo.
