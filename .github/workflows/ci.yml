name: pr-fast

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A chave precisa ser POR COMMIT na main e POR PR no pull_request. Com
# `github.ref` ela virava `refs/heads/main` em TODO push da main — um grupo só
# para a branch inteira — e, como cada merge é seguido do commit de release ~90 s
# depois, o run do merge morria cancelado pelo run do release, e o do release
# morria no merge seguinte. Medido: 18 de 29 runs de push na main cancelados, e
# foi assim que o #605 entrou sem nenhuma rodada de invariantes chegar ao fim
# (run do merge c14f87198 cancelado 23:19:56, run do release alpha.280 cancelado
# 23:21:31). Em PR `github.ref` já era único (refs/pull/N/merge), então o efeito
# desejado — run novo do MESMO PR cancela o velho — continua igual. Mesmo padrão
# que o autofix.yml já usa. No lote da fila de merge a chave é o ref dele, único por lote.
concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # O contexto obrigatório `build` sai de UM job só (DG4), e esse job é o AGREGADOR abaixo.
  # As invariantes custavam 6,5 a 9 min de um job de 9 a 12 min, em série com todo o
  # resto; agora rodam em paralelo no job `invariantes`. Nenhum passo saiu.
  reguas-e-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Dependências (npm ci)
        id: deps
        run: npm ci
      - name: Python CI scripts syntax
        run: python3 -m py_compile scripts/ci/*.py
      - name: Bash scripts syntax
        run: bash -n scripts/*.sh
      - name: Fronteira de confiança dos workflows
        run: python3 scripts/ci/workflow_security_check.py --selftest
      # O gatilho do portão de navegador e do smoke cobre o fecho do que eles rodam
      # (scripts/ci/gatilho.mjs). Node puro, < 1 s.
      - name: Gatilho do portão e do smoke cobre o que eles medem
        run: npm run eval:portaogatilho
      # Réguas de workflow e as de contrato em node puro (< 2 s, sem npm ci). Ficavam só no
      # check:fast, que roda na máquina de quem lembra: PR que quebrasse workflow passava
      # aqui verde. O runner roda todas e só reprova no fim (PI3 cobra esta lista).
      - name: Réguas de workflow, release, privacidade e escolha (node puro)
        run: node tools/eval/runner.mjs eval:wfsecret eval:wflocal eval:wftimeout eval:wfconcurrency eval:deploygate eval:autofix eval:mutcega eval:portaointeiro eval:release eval:privacy eval:noescolha eval:contagens-pr eval:mergequeue eval:sondafilho
      # Job que só lê histórico ou poucos arquivos faz checkout leve (CL1). Node puro.
      - name: Checkout leve nos jobs que só leem histórico
        run: npm run eval:wfcheckout
      - name: Syntax check do jogo (public/js)
        run: npm run syntax
      - name: Regras da horda e consumo de objetivo no cliente
        run: npm run eval:javaporcos
      - name: Grafo de módulos da árvore fecha (import nomeado tem export, #524)
        run: npm run eval:modgraph
      # As réguas de telemetria/identidade/proveniência migraram com as rotas para o
      # corosolto/backend (api/reguas/); aqui fica o portão de que a migração não regride
      # e o pedaço da proveniência que continua no cliente (hook de console.error).
      - name: Rotas de banco fora do cliente (18 migradas, 307 em dia)
        run: npm run eval:apis
      - name: Proveniência de erros — lado do cliente (hook de console)
        run: npm run eval:error-console
      - name: UUID compatível com navegadores antigos
        run: npm run eval:uuid
      - name: Loja sem fila de próximas skins
        run: npm run eval:treta-fila
      - name: Sete moedas da loja com arte própria
        run: npm run eval:treta-coins
      - name: Skin equipada aguarda manifesto e conta vigente no boot
        run: npm run eval:treta-manifest-ready
      - name: Preview mobile preserva skin e propriedade da mídia
        run: npm run eval:character-preview-media
      - name: Acúmulo de armas no chão tem teto
        run: npm run eval:drop
      - name: Loja sem nome de político real
        run: npm run eval:treta-nomes
      - name: Proxy de captura grava só dentro da pasta de saída
        run: npm run eval:capturecodex
      - name: Aba da loja no hub diz só LOJA
        run: npm run eval:hub-loja
      - name: TRETA$ da partida segue o CS e não toca a carteira do menu
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:economia
      - name: TRETA$ da partida dentro do Game real (compra, morte, rodada)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:economia-jogo
      # Pendurar a régua só no `check:fast` a faria rodar na máquina de quem lembra
      # de rodar, e NÃO no portão: este job lista cada `npm run eval:*` explicitamente.
      - name: Telemetria preserva modo real e consentimento
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/telemetry-mode-check.mjs
      - name: Contratos visuais de mapas, personagens, câmera e equipamento
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:shot-final-pose eval:authored-locomotion eval:character-normal-quality eval:grafite-curation eval:map-material-finish eval:ferro-balcao eval:match-pickups eval:net-flash-disable eval:normal-only-fit-equivalence eval:tp-world-contract eval:skin-profile-flow eval:death-camera-consistency eval:visual-map-contracts eval:knife-skin-markings eval:campo-uv eval:grafite-atual:prova
      - name: Flash, fluidez e ADS da AK pública
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:flashbang mut:flashbang eval:movimento-fluidez eval:ads1p-public eval:posto-board-support eval:preview-grip-phase eval:armadura eval:ads1p-runtime-public
      - name: Todo mapa devolve o que o game.js consome
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:mapcontrato
      - name: Loops de áudio de todos os mapas usam src carregável
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:soundscape-contract
      - name: Pichação colada na parede e sem vazar pela quina da frente
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:pichacao-parede
      - name: Amazônia acessível e bots entre palafitas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:amazonia
      - name: Escadão — circulação, estrutura e casa
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:escadao-graph eval:escadao-home eval:escadao-structure eval:escadao-descent eval:escadao-details
      - name: Escadão — compatibilidade com pacote de áudio publicado
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/escadao-audio-pack-check.mjs
      # eval:lajes-spawn-space e eval:lajes-raycast saíram daqui porque as invariantes
      # rodam os MESMOS scripts (LSP1 e LRP1, críticas e fora do KNOWN-RED) e reprovam
      # o PR com condição mais forte que o código de saída: saída 0 E a linha ✓.
      - name: Fauna curada no mapa e preload mobile
        run: npm run eval:map-fauna-curated
      - name: Lajes — geometria, ambiência, integração e preview
        run: node tools/eval/runner.mjs eval:lajes-cache eval:lajes-visual eval:lajes-ruas eval:lajes-game eval:lajes-ambiencia eval:lajes-santos eval:lajes-airspace eval:lajes-soundscape eval:mappreview
      - name: Sertão (tema, rotas, criação e integração)
        run: |
          npm run eval:sertao
          npm run eval:velhooeste
          npm run eval:sertao-livestock
          npm run eval:sertao-integration
          npm run eval:sertao-sky-lifecycle
      - name: Veículos do estacionamento em escala de fábrica
        run: npm run eval:escala
      - name: Loja, vídeos de hover das skins (VP9 + H.264 + poster, até 400 KB)
        run: npm run eval:treta-video
      - name: Orçamento de shader WebGL1
        run: npm run eval:shaderbudget
      - name: Sitemap pagina além do max-rows do PostgREST
        run: npm run eval:sitemap-paginacao
      - name: Sitemap só com URL final e sem lastmod inventado
        run: npm run eval:sitemap-higiene

      # O ARCH.md (índice por linha + tabela de conflito) é GERADO. Escrito à
      # mão ele desatualiza no primeiro commit, e uma tabela de conflito com
      # linha errada é pior que não ter tabela: dois agentes acham que estão em
      # regiões diferentes e não estão.
      #
      # NO PUSH DA MAIN estes dois só rodam no commit `chore(release):` (13/10, c2ca685).
      # Com o trem de release (#854) quem regenera os blocos é o release, a cada lote, e não
      # mais cada merge. Dois PRs testados sobre bases diferentes mesclam limpo e deixam
      # uma contagem velha na main: o DOCS1 reprovava o push, o embarque do release.yml
      # exige pr-fast verde, e o trem, que é quem regeneraria, nunca saía. No PR eles
      # continuam valendo sempre; no commit do release eles conferem a regeneração dele.
      # No PR só a estrutura confere; contagem e linha (classe em tools/gen-docs.mjs) só no release.
      - name: Documentação gerada está em dia (estrutura)
        if: github.event_name != 'push'
        run: npm run docs:check
      - name: ARCH.md gerado está em dia (estrutura)
        if: github.event_name != 'push'
        run: npm run arch:check
      - name: Documentação gerada inteira em dia no commit do release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
        run: npm run docs:check:release
      - name: ARCH.md inteiro em dia no commit do release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
        run: npm run arch:check:release
      - name: hreflang dos docs resolve nas duas línguas
        run: npm run eval:docs-hreflang
      # Precisa de rede, por isso NÃO entra no check:deploy (que roda dentro do
      # build da Vercel). Vulnerabilidade nova em dep de produção reprova aqui.
      - name: Dependência de produção sem vulnerabilidade nova
        run: npm run eval:deps
      - name: Manifesto de wallpapers está em dia
        run: npm run media:check
      - name: Brasão servido com ?v= do conteúdo atual
        run: npm run eval:brasao-versao
      - name: Texto público sem travessão
        run: npm run travessao:check
      # Hash das skills de terceiros confere com o skills-lock.json (issue #42):
      # lock que ninguém verifica não detecta conteúdo trocado depois de travado.
      - name: Skills de terceiros conferem com o lock
        run: npm run verify:skills

      - name: Astro build
        run: npm run build

      - name: SEO e links publicados (com mutações)
        run: |
          node tools/eval/seo-check.mjs
          node tools/eval/seo-check.mjs --mutate
          node tools/eval/canonical-host-check.mjs
          node tools/eval/canonical-host-check.mjs --mutate
          node tools/eval/profile-weapons-display-check.mjs
          node tools/eval/profile-weapons-display-check.mjs --mutate
          node tools/eval/profile-treta-balance-check.mjs
          node tools/eval/profile-treta-balance-check.mjs --mutate
          node tools/eval/profile-in-game-check.mjs
          node tools/eval/profile-in-game-check.mjs --mutate
          node tools/eval/profile-friend-request-check.mjs
          node tools/eval/profile-friend-request-check.mjs --mutate
          node tools/eval/profile-socials-check.mjs
          node tools/eval/profile-socials-check.mjs --mutate
          node tools/eval/profile-achievements-check.mjs
          node tools/eval/profile-achievements-check.mjs --mutate
          node tools/eval/profile-views-display-check.mjs
          node tools/eval/profile-views-display-check.mjs --mutate
          node tools/eval/cla-ssr-check.mjs
          node tools/eval/cla-ssr-check.mjs --mutate
          node tools/eval/rotas-check.mjs --dist
          ! node tools/eval/rotas-check.mjs --dist --mutante=robots
          node tools/eval/perfil-abas-check.mjs
          node tools/eval/perfil-abas-check.mjs --mutate
          node tools/eval/profile-character-empty-check.mjs
          node tools/eval/profile-character-empty-check.mjs --mutate

      # PORTÃO DO SITE. `astro build` verde não prova nada sobre as rotas:
      # /ranking pode dar 500, /sitemap.xml pode sair vazio e o build passa em
      # todos os casos. Roda DEPOIS do build porque o arnês sobe o `astro dev`,
      # que precisa das deps instaladas — e checa o caminho de degradação SEM
      # Supabase, que é exatamente o estado do CI.
      - name: Páginas do lobby e cobertura SEO/AEO
        run: npm run eval:game-pages

      - name: Smoke do site (13 rotas, contrato + JSON-LD)
        run: node tools/eval/site-smoke.mjs

  # O bloco do viewmodel e das invariantes, na MESMA ordem de antes: o vm-mint-audit escreve
  # o tools/eval/vm_mint_audit.json que as invariantes e o vm-kick-sim leem.
  invariantes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O auditor de VM escreve o JSON consumido pelas invariantes; a ordem é contrato.
      - name: Enquadramento do viewmodel por arma (26 armas, GLB real)
        run: node tools/eval/vm-mint-audit.mjs
      - name: Invariantes (portão — falha crítica reprova o PR)
        env:
          # Saída de cada sub-simulação, para o passo dos bots não rodar o botsim de novo.
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes
        run: |
          node --test tests/fresh-report.test.mjs
          node tools/eval/invariants.mjs
      - name: Coice do viewmodel (near plane + pitch em rajada)
        run: node tools/eval/vm-kick-sim.mjs
      - name: Faca construída e transições sem bind pose
        run: npm run eval:melee-vm
      - name: Chave tudo-ou-nada do viewmodel (sem ativação parcial)
        run: npm run eval:vm-launch
      - name: Arma visível no mobile e desktop, inclusive sem assets
        run: npm run eval:vm-presence
      # As réguas de imagem (mira, cobertura, pistola-ref, mãos, carregador) pedem o
      # catálogo privado e navegador; aqui o CI cobra o RESULTADO assado delas.
      - name: Placar das réguas de imagem do viewmodel em dia
        run: npm run eval:vm-placar
      # As invariantes já rodaram `botsim.mjs` sem argumento, que é `60 all` (o default
      # do script), com o mesmo ambiente deste job. Este passo publica aquela execução e
      # reprova com o código de saída dela, em vez de gastar ~1 min rodando de novo.
      # Arquivo ausente (invariantes não rodaram o botsim) também reprova.
      - name: Navegação dos bots (60 s × 5 mapas, sementes fixas)
        env:
          SAIDA: ${{ runner.temp }}/invariantes/botsim.mjs
        run: |
          cat "$SAIDA.out"
          cat "$SAIDA.err" >&2
          exit "$(cat "$SAIDA.code")"

  # O AGREGADOR. É ele que responde pelo contexto obrigatório `build` da main (DG4/DG5).
  # `if: always()` é o que impede o pulo: sem ele, job necessário vermelho deixa este
  # SKIPPED, e o ruleset aceita contexto obrigatório pulado como verde. Cancelado,
  # pulado ou vermelho em qualquer `needs` reprova.
  # Família lenta do mantle em job próprio: no run 41286765480 o passo serial
  # 'Validar fluidez, território e rede do mantle' consumiu o teto de 25 min
  # (movimento-fluidez ok 5,4 s; mantle-fluidez ok 41,5 s; mut:mantle terminado
  # no cleanup sem veredito; mantle-network não alcançado). Nenhum comando,
  # ordem interna, semente ou CLI mudou — só trocou o dono do passo.
  mantle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Dependências (npm ci)
        id: deps
        run: npm ci
      - name: Validar fluidez, território e rede do mantle
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:movimento-fluidez eval:mantle-fluidez mut:mantle eval:mantle-network

  build:
    needs: [reguas-e-site, invariantes, mantle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todo job do pr-fast verde
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTADOS"
          [ -n "$RESULTADOS" ] || { echo "::error::nenhum resultado de job necessário"; exit 1; }
          for r in $RESULTADOS; do
            [ "$r" = success ] || { echo "::error::job necessário terminou em $r"; exit 1; }
          done

  # O bloco de autoria sai do shortlog e o squash reescreve o autor: num PR ele não é
  # derivável (ver tools/eval/docs-autoria-check.mjs). Aqui, na main, é — e só aqui reprova.
  # fetch-depth: 0 é obrigatório: com clone raso o gerador PULA esse bloco e o portão fica cego.
  # Só no commit `chore(release):`, pelo mesmo motivo dos passos de docs do job build:
  # entre um trem e outro o bloco fica velho por construção, e reprovar ali trava o trem.
  # Vale o push da main OU o da tag: os dois são o mesmo SHA e caem no mesmo grupo de
  # concurrency, então um cancela o outro (medido: os runs de branch dos alpha.85-.87
  # saíram `cancelled`). Exigir só a branch deixaria a autoria sem conferência nenhuma.
  autoria-na-main:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bloco de autoria em dia (derivável só depois do merge)
        run: npm run docs:check:autoria

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      # Leve: o dco lê mensagem de commit (`git log`/`git show -s`), nunca blob (CL1).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      # Régua se prova antes de medir o PR: portão quebrado passa calado.
      - name: Autoteste das réguas de CI
        run: |
          python3 scripts/ci/ensure_labels.py --selftest
          python3 scripts/ci/autofix_allowlist.py --selftest
          python3 scripts/ci/dco_check.py --selftest
          python3 scripts/ci/agente_check.py --selftest
          # O critério de `bot-fixable` e a varredura semanal decidem sozinhos
          # o que o csbrasil-bot vai rascunhar — e os autotestes deles nunca
          # rodavam aqui. Foi por isso que a não-idempotência sob `issues:
          # edited` sobreviveu até 28/10.
          python3 scripts/ci/issue_review.py --selftest
          python3 scripts/ci/issue_sweep.py --selftest
      # No lote da fila o intervalo inclui os merges que ela escreve; o dco_check.py os isenta.
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          [ -n "$BASE" ] && [ -n "$HEAD" ] || { echo "::error::sem base ou head para medir o DCO"; exit 1; }
          printf '{"baseRefOid":"%s","headRefOid":"%s"}' "$BASE" "$HEAD" > /tmp/dco.json
          python3 scripts/ci/dco_check.py < /tmp/dco.json
      # A régua se prova antes de medir o PR: sem isto, portão quebrado passa calado.
      - name: Check trailer Agent
        run: python3 scripts/ci/agente_check.py < /tmp/dco.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Extrair notas do CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[$TAG\\]/{f=1;next}/^## \\[/{f=0}f" CHANGELOG.md > release-body.md
      - name: Criar GitHub Release
        run: |
          EXTRA=()
          if [ -s release-body.md ]; then
            EXTRA=(--notes "$(cat release-body.md)")
          fi
          # Idempotente: o release.yml do push na main e este job do push da
          # TAG criam a mesma release numa corrida de segundos — o perdedor
          # levava 422 "tag_name already exists" e pintava o run de vermelho
          # (alpha.154, 18/08). Release que já existe NÃO SE TOCA: o `edit`
          # com --notes do CHANGELOG APAGAVA a seção "What's Changed" com os
          # colaboradores que o vencedor gerou (alpha.156-.158, 19/08).
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe (vencedor da corrida) — nada a fazer"
            exit 0
          fi
          gh release create "$TAG" --generate-notes "${EXTRA[@]}" --title "CSBR $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
