  # Cada família tem suas próprias sub-simulações. Nenhum relatório freshReport atravessa
  # processos: o produtor e todos os consumidores ficam no mesmo shard.
  invariantes-fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seletores e invariantes de fonte
        env:
          INVARIANTES_FAMILIA: fonte
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-fonte
        run: |
          node --test tests/fresh-report.test.mjs tests/invariants-shards.test.mjs
          node tools/eval/invariants.mjs
      - name: Evidências das invariantes de fonte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariantes-fonte-${{ github.run_id }}
          path: ${{ runner.temp }}/invariantes-fonte/
          if-no-files-found: warn

  invariantes-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O auditor de VM escreve o JSON consumido pelas invariantes; a ordem é contrato.
      - name: Enquadramento do viewmodel por arma (26 armas, GLB real)
        run: node tools/eval/vm-mint-audit.mjs
      - name: Invariantes do viewmodel
        env:
          INVARIANTES_FAMILIA: vm
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-vm
        run: node tools/eval/invariants.mjs
      # Publica a MESMA execução consumida por VM7/VM8; não roda o coice de novo.
      - name: Coice do viewmodel (near plane + pitch em rajada)
        env:
          SAIDA: ${{ runner.temp }}/invariantes-vm/vm-kick-sim.mjs_--json
        run: |
          cat "$SAIDA.out"
          cat "$SAIDA.err" >&2
          exit "$(cat "$SAIDA.code")"
      - name: Faca construída e transições sem bind pose
        run: npm run eval:melee-vm
      - name: Chave tudo-ou-nada do viewmodel (sem ativação parcial)
        run: npm run eval:vm-launch
      - name: Arma visível no mobile e desktop, inclusive sem assets
        env:
          SAIDA: ${{ runner.temp }}/invariantes-vm/vm-presence-check.mjs_--mutantes
        run: |
          cat "$SAIDA.out"
          cat "$SAIDA.err" >&2
          exit "$(cat "$SAIDA.code")"
      # As réguas de imagem (mira, cobertura, pistola-ref, mãos, carregador) pedem o
      # catálogo privado e navegador; aqui o CI cobra o RESULTADO assado delas.
      - name: Placar das réguas de imagem do viewmodel em dia
        run: npm run eval:vm-placar
      - name: Evidências das invariantes de viewmodel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariantes-vm-${{ github.run_id }}
          path: ${{ runner.temp }}/invariantes-vm/
          if-no-files-found: warn

