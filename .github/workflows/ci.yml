  economia-ak-hud:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Dependências e dist compartilhados
        id: deps
        uses: ./.github/actions/setup-ci-environment
      # ── economia-ak-hud ───────────────────────────────────────────────────────
      - name: TRETA$ da partida segue o CS e não toca a carteira do menu
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:economia
      - name: TRETA$ da partida dentro do Game real (compra, morte, rodada)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:economia-jogo
      - name: Flash, fluidez e ADS da AK pública
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:flashbang mut:flashbang eval:movimento-fluidez eval:ads1p-public eval:posto-board-support eval:preview-grip-phase eval:armadura eval:ads1p-runtime-public --json-out=tools/eval/out/economia-ak-hud.json
      - name: Câmera, atalhos e HUD com mutantes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run eval:cameraoclusao
          node tools/eval/camera-oclusao-mutate.mjs
          node tools/eval/camera-hud-check.mjs
          node tools/eval/camera-hud-check.mjs --mutantes
      - name: Tempos da economia AK e HUD
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: economia-ak-hud-tempos-${{ github.run_id }}
          path: tools/eval/out/economia-ak-hud.json
          if-no-files-found: warn
      # ── invariantes-vm ────────────────────────────────────────────────────────
      # O auditor de VM escreve o JSON consumido pelas invariantes; a ordem é contrato.
      - name: Enquadramento do viewmodel por arma (26 armas, GLB real)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/vm-mint-audit.mjs
      - name: Invariantes do viewmodel
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          INVARIANTES_FAMILIA: vm
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-vm
        run: node tools/eval/invariants.mjs
      # Publica a MESMA execução consumida por VM7/VM8; não roda o coice de novo.
      - name: Coice do viewmodel (near plane + pitch em rajada)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          SAIDA: ${{ runner.temp }}/invariantes-vm/vm-kick-sim.mjs_--json
        run: |
          cat "$SAIDA.out"
          cat "$SAIDA.err" >&2
          exit "$(cat "$SAIDA.code")"
      - name: Faca construída e transições sem bind pose
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:melee-vm
      - name: Chave tudo-ou-nada do viewmodel (sem ativação parcial)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:vm-launch
      - name: Arma visível no mobile e desktop, inclusive sem assets
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          SAIDA: ${{ runner.temp }}/invariantes-vm/vm-presence-check.mjs_--mutantes
        run: |
          cat "$SAIDA.out"
          cat "$SAIDA.err" >&2
          exit "$(cat "$SAIDA.code")"
      # As réguas de imagem (mira, cobertura, pistola-ref, mãos, carregador) pedem o
      # catálogo privado e navegador; aqui o CI cobra o RESULTADO assado delas.
      - name: Placar das réguas de imagem do viewmodel em dia
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:vm-placar
      - name: Evidências das invariantes de viewmodel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariantes-vm-${{ github.run_id }}
          path: ${{ runner.temp }}/invariantes-vm/
          if-no-files-found: warn
      # ── invariantes-mapas-oeste ───────────────────────────────────────────────
      - name: Invariantes de mapas (mapas-oeste)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          INVARIANTES_FAMILIA: mapas-oeste
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-mapas-oeste
        run: node tools/eval/invariants.mjs
      - name: Evidências de mapas (mapas-oeste)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapas-oeste-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/invariantes-mapas-oeste/
            tools/eval/map_check.json
          if-no-files-found: warn

  operacao-flavio:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Dependências e dist compartilhados
        id: deps
        uses: ./.github/actions/setup-ci-environment
      # ── operacao-flavio-escolta ───────────────────────────────────────────────
      - name: Operação Flávio, escolta, VIP e pickups
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:operacao-flavio-escolta --json-out=tools/eval/out/operacao-flavio-escolta.json
      - name: Tempos de escolta da Operação Flávio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operacao-flavio-escolta-tempos-${{ github.run_id }}
          path: tools/eval/out/operacao-flavio-escolta.json
          if-no-files-found: warn
      # ── operacao-flavio-integracao ────────────────────────────────────────────
      - name: Operação Flávio, integração, recuperação e pressão
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:operacao-flavio-integracao --json-out=tools/eval/out/operacao-flavio-integracao.json
      - name: Tempos de integração da Operação Flávio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operacao-flavio-integracao-tempos-${{ github.run_id }}
          path: tools/eval/out/operacao-flavio-integracao.json
          if-no-files-found: warn
      # ── operacao-flavio-core ──────────────────────────────────────────────────
      - name: Operação Flávio, núcleo e veredito estático
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:operacao-flavio-core eval:operacao-reset eval:operacao-duration eval:operacao-clock eval:operacao-boarding eval:character-owned eval:objective-codec-contract eval:operacao-npc --json-out=tools/eval/out/operacao-flavio-core.json
      - name: Tempos do núcleo da Operação Flávio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operacao-flavio-core-tempos-${{ github.run_id }}
          path: tools/eval/out/operacao-flavio-core.json
          if-no-files-found: warn

