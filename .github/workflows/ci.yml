name: pr-fast

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A chave precisa ser POR COMMIT na main e POR PR no pull_request. Com
# `github.ref` ela virava `refs/heads/main` em TODO push da main — um grupo só
# para a branch inteira — e, como cada merge é seguido do commit de release ~90 s
# depois, o run do merge morria cancelado pelo run do release, e o do release
# morria no merge seguinte. Medido: 18 de 29 runs de push na main cancelados, e
# foi assim que o #605 entrou sem nenhuma rodada de invariantes chegar ao fim
# (run do merge c14f87198 cancelado 23:19:56, run do release alpha.280 cancelado
# 23:21:31). Em PR `github.ref` já era único (refs/pull/N/merge), então o efeito
# desejado — run novo do MESMO PR cancela o velho — continua igual. Mesmo padrão
# que o autofix.yml já usa. No lote da fila de merge a chave é o ref dele, único por lote.
concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # O contexto obrigatório `build` sai de UM job só (DG4), e esse job é o AGREGADOR abaixo.
  # As invariantes custavam 6,5 a 9 min de um job de 9 a 12 min, em série com todo o
  # resto; agora rodam em shards paralelos por família e por grupo de mapas. Nenhum passo saiu.
  reguas-e-site:
    runs-on: ubuntu-latest
    # Fila nuclear. Mapas/site foram para job paralelo depois do run 42016661426
    # ser cortado em 35m18s dentro de Flávio, sem veredito vermelho.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Dependências (npm ci)
        id: deps
        run: npm ci
      - name: Python CI scripts syntax
        run: python3 -m py_compile scripts/ci/*.py
      - name: Bash scripts syntax
        run: bash -n scripts/*.sh
      - name: Fronteira de confiança dos workflows
        run: python3 scripts/ci/workflow_security_check.py --selftest
      # O gatilho do portão de navegador e do smoke cobre o fecho do que eles rodam
      # (scripts/ci/gatilho.mjs). Node puro, < 1 s.
      - name: Gatilho do portão e do smoke cobre o que eles medem
        run: npm run eval:portaogatilho
      - name: Ciclo de vida do Keyboard Lock (node puro, com mutantes)
        run: npm run eval:ctrlwlifecycle
      # Réguas de workflow e as de contrato em node puro (< 2 s, sem npm ci). Ficavam só no
      # check:fast, que roda na máquina de quem lembra: PR que quebrasse workflow passava
      # aqui verde. O runner roda todas e só reprova no fim (PI3 cobra esta lista).
      - name: Réguas de workflow, release, privacidade e escolha (node puro)
        run: node tools/eval/runner.mjs eval:wfsecret eval:wflocal eval:wftimeout eval:wfconcurrency eval:deploygate eval:autofix eval:mutcega eval:portaointeiro eval:release eval:privacy eval:noescolha eval:contagens-pr eval:mergequeue eval:sondafilho eval:wfpurge
      # Job que só lê histórico ou poucos arquivos faz checkout leve (CL1). Node puro.
      - name: Checkout leve nos jobs que só leem histórico
        run: npm run eval:wfcheckout
      - name: Syntax check do jogo (public/js)
        run: npm run syntax
      - name: Classificador do smoke pós-deploy
        run: npm run eval:smoke-network
      - name: Taxa de rede (FPS, travada, relógio congelado e mutantes)
        run: npm run eval:netrate
      - name: Contrato de famílias e marcas do áudio
        run: npm run eval:audiomarcas
      - name: Dependências e reconstrução do fundo do menu
        run: |
          npm run eval:menuprops
          node tools/eval/menu-map-props-check.mjs --mutantes
          node tools/eval/menu-map-props-check.mjs --autoteste
      - name: Mutantes do orçamento exigem a falha correta
        run: node tools/eval/boot-mutant-verdict-check.mjs --mutantes
      # boot-assets-check (--mutantes) REMOVIDO nesta PR: a régua era exclusiva da PR
      # (1d15a6453) e ancorava na mede() anterior à base staging r844, que passou a exigir
      # prova criptográfica de corpo (startBootOrigin + snapshot + x-boot-response-id +
      # verifyResponseRecord/verifyDecoded). O fixture sintético não exerce esse pipeline —
      # reconstruí-lo honestamente é follow-up (fixture novo contra boot-network-origin/
      # boot-network-body); as réguas de boot vivas cobrem o fecho: veredicto, READY,
      # poster-intent e overlay com mutantes.
      - name: Causa real da liberação da splash com mutantes
        run: node tools/eval/boot-ready-check.mjs --mutantes
      - name: Enquadramento e limite do stream WebTransport
        run: npm run eval:transport-stream
      - name: Regras da horda e consumo de objetivo no cliente
        run: npm run eval:javaporcos
      - name: Origem da versão nos payloads reais de perf e match
        run: npm run eval:versaoorigem
      - name: Arena, formato melhor-de e preload
        run: node tools/eval/runner.mjs eval:arena-mode eval:formatomelhorde eval:preload
      - name: Mapas JSON, construtor e boot no Game
        run: node tools/eval/runner.mjs eval:mapjson eval:mapjsonboot
      - name: Grafo de módulos da árvore fecha (import nomeado tem export, #524)
        run: npm run eval:modgraph
      # As réguas de telemetria/identidade/proveniência migraram com as rotas para o
      # corosolto/backend (api/reguas/); aqui fica o portão de que a migração não regride
      # e o pedaço da proveniência que continua no cliente (hook de console.error).
      - name: Rotas de banco fora do cliente (18 migradas, 307 em dia)
        run: npm run eval:apis
      - name: Proveniência de erros — lado do cliente (hook de console)
        run: npm run eval:error-console
      - name: UUID compatível com navegadores antigos
        run: npm run eval:uuid
      - name: Loja sem fila de próximas skins
        run: npm run eval:treta-fila
      - name: Sete moedas da loja com arte própria
        run: npm run eval:treta-coins
      - name: Skin equipada aguarda manifesto e conta vigente no boot
        run: npm run eval:treta-manifest-ready
      - name: Preview mobile preserva skin e propriedade da mídia
        run: npm run eval:character-preview-media
      - name: Retrato hero só para personagem com arquivo (#1231, com mutantes)
        run: npm run eval:retratohero
      - name: Rig por transplante encaixa cotovelo e punho, mão sem lâmina (com mutantes)
        run: npm run eval:rigmaos
      - name: Pixel do X insere o script do uwt.js (#1231, com mutante)
        run: npm run eval:xpixel
      - name: Acúmulo de armas no chão tem teto
        run: npm run eval:drop
      - name: Loja sem nome de político real
        run: npm run eval:treta-nomes
      - name: Proxy de captura grava só dentro da pasta de saída
        run: npm run eval:capturecodex
      - name: Aba da loja no hub diz só LOJA
        run: npm run eval:hub-loja
      # Mede só o que o PR ADICIONA; o checkout é raso, então a base vem do evento
      # (PR ou lote) e a régua a busca com --depth=1. Push na main: base = o próprio SHA.
      - name: PR não nasce com lixo (diário, raiz, régua órfã, doc histórico, asset sem dono)
        env:
          FILA_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: npm run eval:lixo
      - name: Preview da Vercel só builda quando o site muda (com mutantes)
        run: npm run eval:vercelignore
      - name: Segredo de SSR é lido em runtime, não inlinado no build (com mutantes)
        run: npm run eval:envruntime
      - name: Allowlist de divergências conhecidas do staging Cloudflare
        run: npm run eval:cfallowlist
      - name: Wrapper de portal embeda o site (frame-ancestors, UTM, pointer-lock)
        run: npm run eval:portalembed
      # Pendurar a régua só no `check:fast` a faria rodar na máquina de quem lembra
      # de rodar, e NÃO no portão: este job lista cada `npm run eval:*` explicitamente.
      - name: Telemetria preserva modo real e consentimento
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/telemetry-mode-check.mjs
      - name: Todo mapa devolve o que o game.js consome
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:mapcontrato
      - name: Spawns orientam jogador e bots pelo consumidor real
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node tools/eval/spawn-facing-proof.mjs --autoteste
          node tools/eval/spawn-facing-proof.mjs
      - name: Backpedal preserva autoridade e lateral com mutantes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node tools/eval/tp-local-backpedal-proof.mjs --autoteste
          node tools/eval/tp-local-backpedal-proof.mjs
      - name: Suites preservam cobertura e seleção do pre-push
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test tests/eval-suites.test.mjs

  contratos-visuais-personagens-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Dependências (npm ci)
        id: deps
        run: npm ci
      - name: Contratos visuais de personagens e câmera
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:shot-final-pose eval:authored-locomotion eval:character-normal-quality eval:normal-only-fit-equivalence eval:tp-world-contract eval:skin-profile-flow eval:death-camera-consistency eval:knife-skin-markings --json-out=tools/eval/out/contratos-visuais-personagens-camera.json
      - name: Tempos dos contratos visuais de personagens e câmera
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contratos-visuais-personagens-camera-tempos-${{ github.run_id }}
          path: tools/eval/out/contratos-visuais-personagens-camera.json
          if-no-files-found: warn

  contratos-visuais-ferro-balcao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
