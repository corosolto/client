name: pr-fast

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A chave precisa ser POR COMMIT na main e POR PR no pull_request. Com
# `github.ref` ela virava `refs/heads/main` em TODO push da main — um grupo só
# para a branch inteira — e, como cada merge é seguido do commit de release ~90 s
# depois, o run do merge morria cancelado pelo run do release, e o do release
# morria no merge seguinte. Medido: 18 de 29 runs de push na main cancelados, e
# foi assim que o #605 entrou sem nenhuma rodada de invariantes chegar ao fim
# (run do merge c14f87198 cancelado 23:19:56, run do release alpha.280 cancelado
# 23:21:31). Em PR `github.ref` já era único (refs/pull/N/merge), então o efeito
# desejado — run novo do MESMO PR cancela o velho — continua igual. Mesmo padrão
# que o autofix.yml já usa. No lote da fila de merge a chave é o ref dele, único por lote.
concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Instalação e build acontecem uma vez por run; os jobs abaixo recebem o resultado.
  # node_modules: cache pela hash do package-lock.json (Node 22 fixo), gravado logo depois
  # do `npm ci` e ANTES do build — o que entra na cache é só o que o `npm ci` escreveu.
  # Cache de PR só é lida pelo próprio PR; a da main, por todos (escopo de cache do
  # GitHub). dist: scripts/ci/dist-compartilhado.mjs sobe só o que o checkout do
  # consumidor não tem (espelho .vercel/output/static e cópias de public/ ficam de fora).
  # O artefato não leva run_attempt no nome: `gh run rerun --failed` não refaz o setup e
  # os jobs rerodados baixam o dist da tentativa que o construiu; rerun completo sobrescreve.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Cache das dependências pelo package-lock.json
        id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: pr-fast-node-v2-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Dependências (npm ci)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Guarda as dependências antes do build
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: node_modules
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Astro build
        env:
          API_PROXY_SECRET: SENTINEL_ci_api_proxy
          SUPABASE_URL: SENTINEL_ci_supabase_url
          SUPABASE_SERVICE_ROLE_KEY: SENTINEL_ci_supabase_key
          X_PIXEL_TOKEN: SENTINEL_ci_x_pixel
        run: npm run build
      - name: Empacota o dist sem o que o checkout já tem
        run: node scripts/ci/dist-compartilhado.mjs empacota "$RUNNER_TEMP/pr-fast-dist"
      - name: Publica o dist compartilhado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-fast-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-fast-dist/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  # O contexto obrigatório `build` sai de UM job só (DG4), e esse job é o AGREGADOR no fim.
  # DISTRIBUIÇÃO (17/11/2026): o pr-fast tinha 41 jobs depois do setup e o plano Free da
  # org roda 20 por vez; cada job pagava ~55 s fixos (checkout de ~25 s + 1,33 GB de dist)
  # e esperava 3-4 min na fila (p50). Os mesmos passos foram juntados em lotes de ~7 min,
  # balanceados pela duração medida de cada um (manifesto do eval-duration-calibration e
  # tempos por passo). Nenhum passo saiu nem duplicou; o eval:portaointeiro (PI4) cobra o
  # dono de cada grupo. Cada passo roda com `!cancelled() && deps ok`: régua vermelha num
  # lote não pula as réguas independentes que vêm depois dela. Para rebalancear, mova
  # blocos `# ── <unidade>` inteiros entre lotes (o bloco do chars-mat fica por último:
  # a action studio-packs exporta STUDIO_PACK_ROOT para o resto do job).

  reguas-e-site:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Dependências e dist compartilhados
        id: deps
        uses: ./.github/actions/setup-ci-environment
      # ── reguas-e-site ─────────────────────────────────────────────────────────
      - name: Python CI scripts syntax
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 -m py_compile scripts/ci/*.py
      - name: Bash scripts syntax
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash -n scripts/*.sh
      - name: Fronteira de confiança dos workflows
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 scripts/ci/workflow_security_check.py --selftest
      # O gatilho do portão de navegador e do smoke cobre o fecho do que eles rodam
      # (scripts/ci/gatilho.mjs). Node puro, < 1 s.
      - name: Gatilho do portão e do smoke cobre o que eles medem
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:portaogatilho
      - name: Ciclo de vida do Keyboard Lock (node puro, com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:ctrlwlifecycle
      # Réguas de workflow e as de contrato em node puro (< 2 s, sem npm ci). Ficavam só no
      # check:fast, que roda na máquina de quem lembra: PR que quebrasse workflow passava
      # aqui verde. O runner roda todas e só reprova no fim (PI3 cobra esta lista).
      - name: Réguas de workflow, release, privacidade e escolha (node puro)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:wfsecret eval:wflocal eval:wftimeout eval:wfconcurrency eval:deploygate eval:autofix eval:mutcega eval:portaointeiro eval:release eval:privacy eval:noescolha eval:contagens-pr eval:mergequeue eval:sondafilho eval:wfpurge
      # Job que só lê histórico ou poucos arquivos faz checkout leve (CL1). Node puro.
      - name: Checkout leve nos jobs que só leem histórico
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:wfcheckout
      - name: Syntax check do jogo (public/js)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run syntax
      - name: Classificador do smoke pós-deploy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:smoke-network
      - name: Taxa de rede (FPS, travada, relógio congelado e mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:netrate
      - name: Estados remotos v9, compatibilidade v8 e mutantes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:netcodecbin eval:rede3p
      - name: Contrato de famílias e marcas do áudio
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:audiomarcas
      - name: Studio pack verification and immutable install
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:studiopack
      - name: Dependências e reconstrução do fundo do menu
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run eval:menuprops
          node tools/eval/menu-map-props-check.mjs --mutantes
          node tools/eval/menu-map-props-check.mjs --autoteste
      - name: Mutantes do orçamento exigem a falha correta
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/boot-mutant-verdict-check.mjs --mutantes
      # boot-assets-check (--mutantes) REMOVIDO nesta PR: a régua era exclusiva da PR
      # (1d15a6453) e ancorava na mede() anterior à base staging r844, que passou a exigir
      # prova criptográfica de corpo (startBootOrigin + snapshot + x-boot-response-id +
      # verifyResponseRecord/verifyDecoded). O fixture sintético não exerce esse pipeline —
      # reconstruí-lo honestamente é follow-up (fixture novo contra boot-network-origin/
      # boot-network-body); as réguas de boot vivas cobrem o fecho: veredicto, READY,
      # poster-intent e overlay com mutantes.
      - name: Causa real da liberação da splash com mutantes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/boot-ready-check.mjs --mutantes
      - name: Enquadramento e limite do stream WebTransport
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:transport-stream
      - name: Regras da horda e consumo de objetivo no cliente
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:javaporcos
      - name: Origem da versão nos payloads reais de perf e match
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:versaoorigem
      - name: Arena, formato melhor-de e preload
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:arena-mode eval:formatomelhorde eval:preload
      - name: Mapas JSON, construtor e boot no Game
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:mapjson eval:mapjsonboot
      - name: Grafo de módulos da árvore fecha (import nomeado tem export, #524)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:modgraph
      # As réguas de telemetria/identidade/proveniência migraram com as rotas para o
      # corosolto/backend (api/reguas/); aqui fica o portão de que a migração não regride
      # e o pedaço da proveniência que continua no cliente (hook de console.error).
      - name: Rotas de banco fora do cliente (18 migradas, 307 em dia)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:apis
      - name: Proveniência de erros — lado do cliente (hook de console)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:error-console
      - name: UUID compatível com navegadores antigos
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:uuid
      - name: Loja sem fila de próximas skins
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:treta-fila
      - name: Sete moedas da loja com arte própria
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:treta-coins
      - name: Skin equipada aguarda manifesto e conta vigente no boot
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:treta-manifest-ready
      - name: Preview mobile preserva skin e propriedade da mídia
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:character-preview-media
      - name: Retrato hero só para personagem com arquivo (#1231, com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:retratohero
      - name: Rig por transplante encaixa cotovelo e punho, mão sem lâmina (com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:rigmaos
      - name: Personagem do Studio por release fixada, verificação fail-closed, /packs/ e origem R2 (com mutantes)
        if: always()
        run: npm run eval:studiochar
      - name: Publicador R2 dos pacotes do Studio — imutável, MIME, Cache-Control, CORS, SHA (com mutantes)
        if: always()
        run: npm run eval:packpublish
      - name: Fora do Ar — registro, packs, arte, passe e catálogo (com mutantes)
        if: always()
        run: npm run eval:fora-do-ar
      - name: Pixel do X insere o script do uwt.js (#1231, com mutante)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:xpixel
      - name: Acúmulo de armas no chão tem teto
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:drop
      - name: Loja sem nome de político real
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:treta-nomes
      - name: Proxy de captura grava só dentro da pasta de saída
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:capturecodex
      - name: Aba da loja no hub diz só LOJA
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:hub-loja
      # Mede só o que o PR ADICIONA; o checkout é raso, então a base vem do evento
      # (PR ou lote) e a régua a busca com --depth=1. Push na main: base = o próprio SHA.
      - name: PR não nasce com lixo (diário, raiz, régua órfã, doc histórico, asset sem dono)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          FILA_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: npm run eval:lixo
      - name: Integração Vercel permanece congelada, sem build (com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:vercelignore
      - name: Segredo de SSR é lido em runtime, não inlinado no build (com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:envruntime
      - name: Allowlist de divergências conhecidas do staging Cloudflare
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:cfallowlist
      - name: Borda Cloudflare — cache, viewmodel do R2 e apex (com mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:cfborda
      - name: Wrapper de portal embeda o site (frame-ancestors, UTM, pointer-lock)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:portalembed
      # Pendurar a régua só no `check:fast` a faria rodar na máquina de quem lembra
      # de rodar, e NÃO no portão: este job lista cada `npm run eval:*` explicitamente.
      - name: Telemetria preserva modo real e consentimento
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/telemetry-mode-check.mjs
      - name: Todo mapa devolve o que o game.js consome
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:mapcontrato
      - name: Spawns orientam jogador e bots pelo consumidor real
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node tools/eval/spawn-facing-proof.mjs --autoteste
          node tools/eval/spawn-facing-proof.mjs
      - name: Backpedal preserva autoridade e lateral com mutantes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node tools/eval/tp-local-backpedal-proof.mjs --autoteste
          node tools/eval/tp-local-backpedal-proof.mjs
      - name: Suites preservam cobertura e seleção do pre-push
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test tests/eval-suites.test.mjs
      - name: Structured workflow guards reject unsafe merges
        if: ${{ always() && !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:workflowguards
      - name: Duration-based sharding preserves full coverage
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node --test tests/eval-duration-shards.test.mjs
      - name: Asset manifests and orphan ratchets stay exact
        if: ${{ always() && !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:assetinventory

      - name: Passe Sessão da Treta obedece ao servidor (sem XP do client, com mutantes)
        if: always()
        run: npm run eval:passe
      # ── invariantes-fonte ─────────────────────────────────────────────────────
      - name: Seletores e invariantes de fonte
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          INVARIANTES_FAMILIA: fonte
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-fonte
        run: |
          node --test tests/fresh-report.test.mjs tests/invariants-shards.test.mjs
          node tools/eval/invariants.mjs
      - name: Evidências das invariantes de fonte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invariantes-fonte-${{ github.run_id }}
          path: ${{ runner.temp }}/invariantes-fonte/
          if-no-files-found: warn

  mapas-e-site:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Dependências e dist compartilhados
        id: deps
        uses: ./.github/actions/setup-ci-environment
      # ── mapas-e-site ──────────────────────────────────────────────────────────
      - name: Pichação colada na parede e sem vazar pela quina da frente
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:pichacao-parede
      - name: Amazônia acessível e bots entre palafitas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:amazonia
      - name: Escadão — circulação, estrutura e casa
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:escadao-graph eval:escadao-home eval:escadao-structure eval:escadao-descent eval:escadao-details

      - name: Escadão — compatibilidade com pacote de áudio publicado
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/escadao-audio-pack-check.mjs
      # eval:lajes-spawn-space e eval:lajes-raycast saíram daqui porque as invariantes
      # rodam os MESMOS scripts (LSP1 e LRP1, críticas e fora do KNOWN-RED) e reprovam
      # o PR com condição mais forte que o código de saída: saída 0 E a linha ✓.
      - name: Fauna curada no mapa e preload mobile
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:map-fauna-curated
      - name: Lajes — geometria, ambiência, integração e preview
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:lajes-cache eval:lajes-visual eval:lajes-ruas eval:lajes-game eval:lajes-ambiencia eval:lajes-santos eval:lajes-airspace eval:lajes-soundscape eval:mappreview
      - name: Sertão (tema, rotas, criação e integração)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run eval:sertao
          npm run eval:velhooeste
          npm run eval:sertao-livestock
          npm run eval:sertao-integration
          npm run eval:sertao-sky-lifecycle
      - name: Veículos do estacionamento em escala de fábrica
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:escala
      - name: Loja, vídeos de hover das skins (VP9 + H.264 + poster, até 400 KB)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:treta-video
      - name: Censo de rig, deformação de skin nunca piora (tetos congelados por sha + mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:rig-census
      - name: Pesos de skin, manga não segue a perna (tetos congelados + mutantes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:pesos-braco-perna
      - name: Orçamento de shader WebGL1
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:shaderbudget
      - name: Sitemap pagina além do max-rows do PostgREST
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:sitemap-paginacao
      - name: Sitemap só com URL final e sem lastmod inventado
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:sitemap-higiene

      # O ARCH.md (índice por linha + tabela de conflito) é GERADO. Escrito à
      # mão ele desatualiza no primeiro commit, e uma tabela de conflito com
      # linha errada é pior que não ter tabela: dois agentes acham que estão em
      # regiões diferentes e não estão.
      #
      # NO PUSH DA MAIN estes dois só rodam no commit `chore(release):` (13/10, c2ca685).
      # Com o trem de release (#854) quem regenera os blocos é o release, a cada lote, e não
      # mais cada merge. Dois PRs testados sobre bases diferentes mesclam limpo e deixam
      # uma contagem velha na main: o DOCS1 reprovava o push, o embarque do release.yml
      # exige pr-fast verde, e o trem, que é quem regeneraria, nunca saía. No PR eles
      # continuam valendo sempre; no commit do release eles conferem a regeneração dele.
      # No PR só a estrutura confere; contagem e linha (classe em tools/gen-docs.mjs) só no release.
      - name: Documentação gerada está em dia (estrutura)
        if: github.event_name != 'push'
        run: npm run docs:check
      - name: ARCH.md gerado está em dia (estrutura)
        if: github.event_name != 'push'
        run: npm run arch:check
      - name: Documentação gerada inteira em dia no commit do release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
        run: npm run docs:check:release
      - name: ARCH.md inteiro em dia no commit do release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
        run: npm run arch:check:release
      - name: hreflang dos docs resolve nas duas línguas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:docs-hreflang
      # Precisa de rede, por isso NÃO entra no check:deploy (que roda dentro do
      # build da Vercel). Vulnerabilidade nova em dep de produção reprova aqui.
      - name: Dependência de produção sem vulnerabilidade nova
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:deps
      - name: Manifesto de wallpapers está em dia
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run media:check
      - name: Brasão servido com ?v= do conteúdo atual
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:brasao-versao
      - name: Texto público sem travessão
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run travessao:check
      # Hash das skills de terceiros confere com o skills-lock.json (issue #42):
      # lock que ninguém verifica não detecta conteúdo trocado depois de travado.
      - name: Skills de terceiros conferem com o lock
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run verify:skills

      - name: Build não inlina segredo (varre os artefatos com as sentinelas)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          API_PROXY_SECRET: SENTINEL_ci_api_proxy
          SUPABASE_URL: SENTINEL_ci_supabase_url
          SUPABASE_SERVICE_ROLE_KEY: SENTINEL_ci_supabase_key
          X_PIXEL_TOKEN: SENTINEL_ci_x_pixel
        run: node tools/eval/env-runtime-check.mjs --varre

      - name: SEO e links publicados (com mutações)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # Fase 6: o build (adapter Cloudflare) carrega [vars] do wrangler.toml no build
          # (loadWranglerEnv) — produção tem RANKING_ON=true e o prerender sai indexável.
          # A régua de rotas compara contra process.env: espelhar produção aqui.
          # O seo-check NÃO recebe a flag: o mutante AEO1 guarda o cenário flag=false
          # (nenhuma página promete ranking) e precisa rodar nesse cenário.
          node tools/eval/seo-check.mjs
          node tools/eval/seo-check.mjs --mutate
          node tools/eval/canonical-host-check.mjs
          node tools/eval/canonical-host-check.mjs --mutate
          node tools/eval/profile-weapons-display-check.mjs
          node tools/eval/profile-weapons-display-check.mjs --mutate
          node tools/eval/profile-treta-balance-check.mjs
          node tools/eval/profile-treta-balance-check.mjs --mutate
          node tools/eval/profile-in-game-check.mjs
          node tools/eval/profile-in-game-check.mjs --mutate
          node tools/eval/profile-friend-request-check.mjs
          node tools/eval/profile-friend-request-check.mjs --mutate
          node tools/eval/profile-socials-check.mjs
          node tools/eval/profile-socials-check.mjs --mutate
          node tools/eval/profile-achievements-check.mjs
          node tools/eval/profile-achievements-check.mjs --mutate
          node tools/eval/match-skin-snapshot-check.mjs
          for m in skin-do-jogo personagem-do-jogo sem-skin-no-fim partial-sem-skin; do
            status=0
            node tools/eval/match-skin-snapshot-check.mjs --mutante=$m || status=$?
            if [ "$status" -ne 1 ]; then echo "::error::mutante $m da skin do fim da partida terminou com $status (quer 1)"; exit 1; fi
          done
          node tools/eval/profile-views-display-check.mjs
          node tools/eval/profile-views-display-check.mjs --mutate
          node tools/eval/cla-ssr-check.mjs
          node tools/eval/cla-ssr-check.mjs --mutate
          RANKING_ON=true node tools/eval/rotas-check.mjs --dist
          output=$(mktemp)
          status=0
          RANKING_ON=true node tools/eval/rotas-check.mjs --dist --mutante=robots >"$output" 2>&1 || status=$?
          cat "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::o mutante robots passou"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::o mutante robots terminou com status inesperado $status"
            exit "$status"
          fi
          if ! grep -Fq '/jogar/multiplayer: robots "index, follow" com indexavel=false' "$output"; then
            echo "::error::o mutante robots terminou sem a cláusula documentada"
            exit 1
          fi
          node tools/eval/perfil-abas-check.mjs
          node tools/eval/perfil-abas-check.mjs --mutate
          node tools/eval/profile-character-empty-check.mjs
          node tools/eval/profile-character-empty-check.mjs --mutate

      # PORTÃO DO SITE. `astro build` verde não prova nada sobre as rotas:
      # /ranking pode dar 500, /sitemap.xml pode sair vazio e o build passa em
      # todos os casos. Roda DEPOIS do build porque o arnês sobe o `astro dev`,
      # que precisa das deps instaladas — e checa o caminho de degradação SEM
      # Supabase, que é exatamente o estado do CI.
      - name: Páginas do lobby e cobertura SEO/AEO
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run eval:game-pages

      - name: Smoke do site (13 rotas, contrato + JSON-LD)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/site-smoke.mjs
      # ── invariantes-mapas-nucleo ──────────────────────────────────────────────
      - name: Invariantes de mapas (mapas-nucleo)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          INVARIANTES_FAMILIA: mapas-nucleo
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-mapas-nucleo
        run: node tools/eval/invariants.mjs
      - name: Evidências de mapas (mapas-nucleo)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapas-nucleo-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/invariantes-mapas-nucleo/
            tools/eval/map_check.json
          if-no-files-found: warn
      # ── invariantes-mapas-amazonia ────────────────────────────────────────────
      - name: Invariantes de mapas (mapas-amazonia)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          INVARIANTES_FAMILIA: mapas-amazonia
          INVARIANTES_SAIDAS: ${{ runner.temp }}/invariantes-mapas-amazonia
        run: node tools/eval/invariants.mjs
      - name: Evidências de mapas (mapas-amazonia)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapas-amazonia-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/invariantes-mapas-amazonia/
            tools/eval/map_check.json
          if-no-files-found: warn
      # ── operacao-flavio-collider-1 ────────────────────────────────────────────
      - name: Operação Flávio, collider 1
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node tools/eval/runner.mjs eval:operacao-flavio-collider-1 --json-out=tools/eval/out/operacao-flavio-collider-1.json
      - name: Tempos do collider 1 da Operação Flávio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operacao-flavio-collider-1-tempos-${{ github.run_id }}
          path: tools/eval/out/operacao-flavio-collider-1.json
          if-no-files-found: warn

