name: distribution-web-artifact

on:
  pull_request:
    paths:
      - 'tools/distribution-web/**'
      - 'tools/portal/**'
      - '.github/workflows/distribution-web.yml'
  workflow_dispatch:
    inputs:
      portal:
        description: 'Portal de destino; o orçamento dele e o teto de 250 MB reprovam o pacote'
        type: choice
        options: [itch, crazygames]
        default: itch
      kind:
        description: 'wrapper = tools/portal/<portal>/ (iframe para o site); site = build Astro servido pelo portal'
        type: choice
        options: [wrapper, site]
        default: wrapper

permissions:
  contents: read

concurrency:
  group: distribution-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/distribution-web -p 'test_*.py' -v
      - run: node --check tools/distribution-web/smoke.mjs
      - name: Wrapper itch empacota e verifica dentro do teto
        run: |
          python3 tools/distribution-web/package.py build --portal itch --kind wrapper
          python3 tools/distribution-web/package.py verify --portal itch --kind wrapper
  package-web:
    if: github.event_name == 'workflow_dispatch'
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL: ${{ inputs.portal }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.kind == 'site'
        with:
          node-version: 22
          cache: npm
      - name: Build existente com assets públicos
        if: inputs.kind == 'site'
        run: |
          npm ci
          bash scripts/fetch-audio.sh
          bash scripts/fetch-decals.sh
          npm run strip:decalbg
          npm run assert:assets
          npm run build
      - name: Pacote, teto de 250 MB e orçamento do portal
        run: python3 tools/distribution-web/package.py build --portal "$PORTAL" --kind "$KIND"
      - name: Artefatos para revisão
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corosolto-${{ inputs.portal }}-${{ inputs.kind }}-${{ github.sha }}
          path: |
            dist/portal/${{ inputs.portal }}-${{ inputs.kind }}/corosolto-${{ inputs.portal }}.zip
            dist/portal/${{ inputs.portal }}-${{ inputs.kind }}/manifest.json
            dist/portal/${{ inputs.portal }}-${{ inputs.kind }}/report.json
          if-no-files-found: warn
          retention-days: 3
