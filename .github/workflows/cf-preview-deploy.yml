name: cf-preview-deploy

on:
  workflow_run:
    workflows: [cf-preview]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: cf-preview-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Carrega configuração confiável
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          persist-credentials: false
      - name: Baixa somente os assets compilados
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cf-preview-${{ github.event.workflow_run.pull_requests[0].number }}
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verifica configuração da conta
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
      - name: Publica versão do Worker
        id: upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CF_WORKERS_TOKEN/CF_API_TOKEN ausente ou sem Workers Scripts:Edit"
            exit 1
          fi
          npx --yes wrangler@4.158.0 versions upload \
            --config wrangler.preview.toml \
            --name csb-preview \
            --message "PR #$PR_NUM" 2>&1 | tee "$RUNNER_TEMP/wrangler-upload.log"
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/wrangler-upload.log" | tail -n 1 | sed 's/[),.]$//')
          if [ -z "$URL" ]; then
            echo "::error::Wrangler não retornou a URL da versão"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview Cloudflare: $URL"
      - name: Atualiza comentário sticky
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/ci/cf_preview_comment.py "$PR_NUM" "$PREVIEW_URL" "$HEAD_SHA"
