# Produção no Cloudflare Workers (docs/runbooks/MIGRACAO-CLOUDFLARE.md, fase 4).
# O push protegido da `main` publica o SHA recebido. O trem chama `workflow_dispatch` com o
# commit de bump porque pushes feitos pelo GITHUB_TOKEN não disparam outro workflow.
name: cf-prod-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: SHA atual da main que o trem de release acabou de publicar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cf-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Cache Purge é uma permissão da zona, separada do token que publica o Worker.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_NAME: ${{ vars.CF_ZONE_NAME }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baixa pacote de áudio privado
        env:
          AUDIO_PACK_URL: ${{ vars.AUDIO_PACK_URL }}
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/fetch-audio.sh --prefetch-r2
      # Viewmodel privado entra no build como asset estático: servido pelo Worker, cada GLB
      # era uma invocação cobrada (88% das chamadas do csb-prod em 17/11).
      - name: Baixa viewmodels privados do R2
        env:
          VM_R2_BUCKET: corosolto-private
          VM_REQUIRED: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/fetch-viewmodels.sh
      - name: Build Cloudflare
        id: build
        env:
          AUDIO_PACK_URL: ${{ vars.AUDIO_PACK_URL }}
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
        run: |
          set -euo pipefail
          CS_BUILD_SHA="$(git rev-parse HEAD)"
          export CS_BUILD_SHA
          echo "sha=$CS_BUILD_SHA" >> "$GITHUB_OUTPUT"
          npm run build:cf
      - name: Envia versão candidata de csb-prod
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CS_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          bash tools/cf/bootstrap-worker.sh csb-prod
          npx wrangler triggers deploy --config wrangler.prod.toml
          npx wrangler versions upload \
            --config wrangler.prod.toml \
            --message "release $CS_BUILD_SHA" 2>&1 | tee "$RUNNER_TEMP/wrangler-prod-upload.log"
          VERSION_ID=$(grep 'Worker Version ID:' "$RUNNER_TEMP/wrangler-prod-upload.log" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' | tail -n 1)
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/wrangler-prod-upload.log" | tail -n 1 | sed 's/[),.]$//')
          [ -n "$VERSION_ID" ] && [ -n "$URL" ] || {
            echo "::error::Wrangler não retornou ID e URL da versão candidata"
            exit 1
          }
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verifica versão candidata (build, áudio e viewmodels)
        env:
          CS_BUILD_SHA: ${{ steps.build.outputs.sha }}
          CANDIDATE_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          node tools/cf/verifica-deploy.mjs --base="$CANDIDATE_URL" --sha="$CS_BUILD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Promove versão verificada para csb-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CS_BUILD_SHA: ${{ steps.build.outputs.sha }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          node tools/cf/assert-branch-head.mjs --branch=main --sha="$CS_BUILD_SHA"
          npx wrangler versions deploy "$VERSION_ID@100" \
            --config wrangler.prod.toml \
            --yes
      # BUG-39: o HTML antigo ainda pode pedir URLs versionadas de /js/; o manifesto de skins
      # também é mutável sob /models/. Token sem Zone:Read/Cache Purge não invalida a versão
      # já promovida: avisa com o motivo; prod-watch mantém o probe de coerência independente.
      - name: purge do edge Cloudflare (/js/ + CSS + manifesto de skins)
        if: env.CF_API_TOKEN != ''
        run: |
          set -euo pipefail
          ZONE_NAME="${CF_ZONE_NAME:-corosolto.com.br}"
          ZONE_JSON=$(curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME") || ZONE_JSON=''
          if ! ZONE_ID=$(printf '%s' "$ZONE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j=null;try{j=JSON.parse(s)}catch{}const id=j?.result?.[0]?.id;if(id){process.stdout.write(String(id));return}process.stdout.write((j?.errors||[]).map(e=>e.code+' '+e.message).join('; ')||(j?'nenhuma zona visível para o token':'resposta sem JSON'));process.exit(1)})"); then
            echo "::warning title=purge do edge pulado::CF_API_TOKEN não enxerga a zona $ZONE_NAME ($ZONE_ID). Dê ao token Zone:Read + Cache Purge nessa zona ou defina CF_ZONE_NAME. A versão promovida continua válida."
            exit 0
          fi
          PURGE_JSON=$(curl -sS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"prefixes":["www.corosolto.com.br/js/","www.corosolto.com.br/style.css","www.corosolto.com.br/models/skins/manifest.json"]}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache") || PURGE_JSON=''
          if ! MOTIVO=$(printf '%s' "$PURGE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j=null;try{j=JSON.parse(s)}catch{}if(j?.success===true)return;process.stdout.write((j?.errors||[]).map(e=>e.code+' '+e.message).join('; ')||'resposta sem JSON');process.exit(1)})"); then
            echo "::warning title=purge do edge falhou::purge_cache da zona $ZONE_NAME sem success:true ($MOTIVO). A versão promovida continua válida."
          fi
