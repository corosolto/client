name: csbrasil-bot-automerge

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  # Reavalia quando o CI TERMINA. Antes só olhava no label/sync — com os checks ainda
  # pendentes `check_rollup_ok` dava falso e ninguém olhava de novo depois do verde,
  # então o `pronto-pra-merge` quase nunca acendia.
  workflow_run:
    workflows: [pr-fast, smoke-web, pr-gates, pr-language, hotfix-ancestry-gate]
    types: [completed]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  actions: write
  contents: write
  pull-requests: write

# Uma avaliação por PR de cada vez, e a mais nova é a que vale (status mais recente).
# EXCEÇÃO no `labeled`: o próprio job põe `pronto-pra-merge` com o PAT, e isso dispara
# um run `labeled` na hora. Se ele cancelasse o run em andamento, o cancelamento cairia
# entre a etiqueta e o comentário. O run `labeled` então espera na fila em vez de matar.
# push na main (workflow_run sem PR) cai no run_id e não agrupa com ninguém.
concurrency:
  group: automerge-${{ github.event.pull_request.number || inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # A GUARDA DO TOKEN É PASSO, NÃO JOB (14/10/2026). Era um job `bot-token` só para ler o
  # secret: um runner a mais em cada disparo, e este workflow dispara em label, sync,
  # ready_for_review e a cada pr-fast que termina. Sem o PAT o job continua verde e
  # pulando, com o mesmo aviso (WSEC2 cobra a guarda e o `if:` de cada passo seguinte).
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run de push na main (ou de fork, que não traz número de PR) não tem PR para olhar.
    if: >-
      (github.event_name != 'workflow_run' && github.event_name != 'schedule') ||
      ((github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target') &&
      github.event.workflow_run.pull_requests[0].number)
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Guarda do token do bot
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "pular=1" >> "$GITHUB_ENV"
            echo "::warning title=Bot inerte::CSBRASIL_BOT_TOKEN nao configurado — este workflow esta pulando. Ele PRECISA de PAT: merge/push com o GITHUB_TOKEN padrao nao dispara os workflows a jusante, entao a PR entraria sem rodar os portoes."
          fi
      # Leve (CL1): o job só roda scripts/ci/*.py; o resto vem da API.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.pular != '1'
        with:
          filter: blob:none
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: env.pular != '1'
        with:
          python-version: '3.13'
      - name: Garante a etiqueta de pronto
        if: env.pular != '1'
        run: python3 scripts/ci/ensure_labels.py pronto-pra-merge
      - name: Fetch PR status
        if: env.pular != '1'
        run: gh pr view "$PR_NUMBER" --json isDraft,labels,reviewDecision,mergeStateStatus,statusCheckRollup,files,changedFiles,baseRefName,headRefName,headRepository > /tmp/automerge.json
      - name: Check eligibility
        if: env.pular != '1'
        # O autoteste roda ANTES da decisão: este script mescla sem humano no
        # caminho, e portão quebrado que passa calado aqui mescla PR vermelho.
        run: |
          python3 scripts/ci/check_automerge.py --selftest
          python3 - <<'PY'
          import json, os
          path = '/tmp/automerge.json'
          pr = json.load(open(path))
          pr['expected_repository'] = os.environ['GITHUB_REPOSITORY']
          open(path, 'w').write(json.dumps(pr))
          PY
          python3 scripts/ci/check_automerge.py < /tmp/automerge.json > /tmp/automerge-result.json
      # O dono autorizou merge automático em 09/11/2026: PR segura entra na base
      # classificada; o lote oficial staging→main entra por merge commit, sem apagar staging.
      - name: Merge when eligible
        if: env.pular != '1'
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          data = json.load(open('/tmp/automerge-result.json'))
          pr = os.environ['PR_NUMBER']
          if not data.get('eligible'):
              print('pronto-pra-merge: not eligible')
              subprocess.run(['gh', 'pr', 'edit', pr, '--remove-label', 'pronto-pra-merge'], check=False)
              sys.exit(0)
          ja = subprocess.run(['gh', 'pr', 'view', pr, '--json', 'labels', '--jq',
                               '[.labels[].name] | index("pronto-pra-merge") != null'],
                              capture_output=True, text=True).stdout.strip() == 'true'
          subprocess.run(['gh', 'pr', 'edit', pr, '--add-label', 'pronto-pra-merge'], check=True)
          if not ja:
              kind = 'the daily release batch' if data.get('merge_kind') == 'release-batch' else 'a safe change'
              subprocess.run(['gh', 'pr', 'comment', pr, '--body',
                              f'🤖 **csbrasil-bot**: required checks passed and the diff meets the '
                              f'`check_automerge` criteria. Merging automatically as {kind}.'], check=True)
          command = ['gh', 'pr', 'merge', pr, '--merge']
          if data.get('merge_kind') != 'release-batch':
              command.append('--delete-branch')
          subprocess.run(command, check=True)
          PY

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Reevaluate every open safe or release PR
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CSBRASIL_BOT_TOKEN is missing; the automerge sweep cannot run."
            exit 0
          fi
          for pr in $(gh pr list --repo "$REPO" --state open --limit 100 --json number,labels \
                        --jq '.[] | select(any(.labels[]; .name == "safe-automerge" or .name == "release")) | .number'); do
            gh workflow run csbrasil-bot-automerge.yml --repo "$REPO" -f pr_number="$pr" \
              || echo "::warning::could not reevaluate PR #$pr"
          done
