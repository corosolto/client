name: csbrasil-bot-automerge

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  bot-token:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BOT_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CSBRASIL_BOT_TOKEN is not configured; skipping bot job."
          fi

  automerge:
    needs: bot-token
    runs-on: ubuntu-latest
    if: needs.bot-token.outputs.available == 'true'
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fetch PR status
        run: gh pr view "$PR_NUMBER" --json isDraft,labels,reviewDecision,mergeStateStatus,statusCheckRollup,files > /tmp/automerge.json
      - name: Check eligibility
        run: python3 scripts/ci/check_automerge.py < /tmp/automerge.json > /tmp/automerge-result.json
      - name: Merge when eligible
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          data = json.load(open('/tmp/automerge-result.json'))
          if not data.get('eligible'):
              print('automerge: not eligible')
              sys.exit(0)
          subprocess.run(['gh', 'pr', 'merge', os.environ['PR_NUMBER'], '--squash', '--delete-branch', '--auto'], check=True)
          PY
