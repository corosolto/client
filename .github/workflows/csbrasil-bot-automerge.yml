name: csbrasil-bot-automerge

# AUTO-MERGE NATIVO (17/11/2026). Este workflow não espera check nenhum: publica o
# commit status `politica-merge` na head e arma/desarma o auto-merge nativo do GitHub
# (merge commit). Quem espera os checks é o ruleset da base, que exige `politica-merge`
# junto com os portões (docs/quality-gates.md). Medido em 30 dias antes da troca (18/10 a
# 17/11): 6.016 runs deste workflow, 2.938 cancelados, 3.550 vindos do fan-in de
# `workflow_run` de 5 workflows, o resto de cada label e do cron de 30 min — e 0 dos 60
# PRs mergeados de 10 a 17/11 foram por ele.
#
# GATILHO ÚNICO: `workflow_dispatch`, disparado pelo `csbrasil-bot-pr-classify` no fim de
# cada classificação (e pelo sweep dele, via classify). O classify já escuta tudo de que a
# política depende — push (head nova), labels de gente, base, draft→pronto, review
# enviado/descartado e comentário de review — e despacha DEPOIS de aplicar as próprias
# labels, então a política nunca lê label velha. O dispatch roda a versão do default
# branch, nunca a do PR. Saíram:
# - `workflow_run` de pr-fast/smoke-web/pr-gates/pr-language/hotfix-ancestry-gate: o
#   nativo espera os checks exigidos; o bot não precisa ver ninguém terminar;
# - `schedule` (sweep de 30 min): o status é por SHA e o nativo mergeia sozinho quando
#   os checks ficam verdes; evento perdido deixa a head SEM `politica-merge`, e contexto
#   exigido ausente segura o merge (falha fechada). O sweep do classify cobre PR de fork;
# - `pull_request_target`: duplicava o classify em todo evento.
# Resolver conversa não dispara Actions (não há gatilho `pull_request_review_thread`), por
# isso conversa aberta não entra no `politica-merge`: quem a segura é a regra nativa de
# conversa resolvida, exigida no ruleset antes de o bot armar (docs/quality-gates.md).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

# Leituras de metadata usam o GITHUB_TOKEN (mesmo contrato do WSEC3 no classify): o
# `gh pr view` com assignees/reviews/autoMergeRequest consulta `login`, que exige
# `read:org`, e o PAT do bot só tem `repo`/`workflow` (medido em 17/11, run 44057889277).
# Escritas (status, armar, merge, label, comentário) continuam com o PAT.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

# Uma avaliação por PR; a mais nova vale. Cancelar no meio é seguro: o status sai antes
# de armar/desarmar, e o run seguinte refaz a decisão inteira.
concurrency:
  group: automerge-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # A GUARDA DO TOKEN É PASSO, NÃO JOB (14/10/2026). Sem o PAT o job continua verde e
  # pulando, com o mesmo aviso (WSEC2 cobra a guarda e o `if:` de cada passo seguinte).
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      READ_GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Guarda do token do bot
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "pular=1" >> "$GITHUB_ENV"
            echo "::warning title=Bot inerte::CSBRASIL_BOT_TOKEN nao configurado — este workflow esta pulando. Ele PRECISA de PAT: merge/push com o GITHUB_TOKEN padrao nao dispara os workflows a jusante, entao a PR entraria sem rodar os portoes."
          fi
      # Leve (CL1): o job só roda scripts/ci/*.py; o resto vem da API.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.pular != '1'
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: env.pular != '1'
        with:
          python-version: '3.13'
      - name: Garante a etiqueta de pronto
        if: env.pular != '1'
        run: python3 scripts/ci/ensure_labels.py pronto-pra-merge
      - name: Fetch PR status
        if: env.pular != '1'
        run: GH_TOKEN="$READ_GH_TOKEN" gh pr view "$PR_NUMBER" --json title,body,assignees,isDraft,labels,reviewDecision,mergeStateStatus,statusCheckRollup,latestReviews,reviewRequests,files,changedFiles,baseRefName,baseRefOid,headRefName,headRefOid,headRepository > /tmp/automerge.json
      - name: Count unresolved review conversations
        if: env.pular != '1'
        run: |
          python3 scripts/ci/pr_threads.py --selftest
          python3 scripts/ci/pr_threads.py --inject /tmp/automerge.json "$PR_NUMBER"
      - name: Attest complete Git evidence
        if: env.pular != '1'
        run: |
          python3 scripts/ci/pr_attestation.py --selftest
          python3 - <<'PY'
          import json, os
          payload = {
              'pr': json.load(open('/tmp/automerge.json')),
              'pr_number': int(os.environ['PR_NUMBER']),
              'expected_repository': os.environ['GITHUB_REPOSITORY'],
          }
          open('/tmp/automerge-attestation-input.json', 'w').write(json.dumps(payload))
          PY
          python3 scripts/ci/pr_attestation.py --emit < /tmp/automerge-attestation-input.json > /tmp/automerge-attestation.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/automerge-attestation-input.json'))
          payload['attestation'] = json.load(open('/tmp/automerge-attestation.json'))
          open('/tmp/automerge-attestation-input.json', 'w').write(json.dumps(payload))
          PY
          python3 scripts/ci/pr_attestation.py --apply < /tmp/automerge-attestation-input.json > /tmp/automerge-attested.json
          mv /tmp/automerge-attested.json /tmp/automerge.json
      - name: Check eligibility
        if: env.pular != '1'
        # O autoteste roda ANTES da decisão: este script decide merge sem humano no
        # caminho, e portão quebrado que passa calado aqui mescla PR vermelho.
        run: |
          python3 scripts/ci/check_automerge.py --selftest
          python3 scripts/ci/check_automerge.py < /tmp/automerge.json > /tmp/automerge-result.json
      # O dono autorizou merge automático em 09/11/2026: PR segura entra na base
      # classificada; o lote oficial staging→main entra por merge commit, sem apagar staging.
      # Publica `politica-merge` e só então arma/desarma o auto-merge nativo; merge direto
      # só com o critério completo antigo (ver scripts/ci/automerge_merge.py).
      - name: Merge when eligible
        if: env.pular != '1'
        run: |
          python3 scripts/ci/automerge_merge.py --selftest
          python3 scripts/ci/automerge_merge.py
