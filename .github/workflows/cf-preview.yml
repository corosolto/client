name: cf-preview

on:
  # O build roda sem segredos; o deploy confiável é disparado em outro workflow.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rodar: ${{ steps.filtro.outputs.rodar }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      # O filtro mora em scripts/ci/gatilho.mjs (SITE): o smoke-web lê a mesma lista
      # para o smoke-cf não esperar um preview que este job decidiu não construir.
      # Falha FECHADO: erro de diff ou do gatilho = preview roda; só `rodar=false` pula.
      - name: O PR toca o site?
        id: filtro
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git -c core.quotePath=false diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/arquivos.txt"; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "diff indisponível: preview roda"
            exit 0
          fi
          node scripts/ci/gatilho.mjs site < "$RUNNER_TEMP/arquivos.txt" > "$RUNNER_TEMP/veredito.txt" \
            || echo "rodar=true" > "$RUNNER_TEMP/veredito.txt"
          if grep -qx 'rodar=false' "$RUNNER_TEMP/veredito.txt"; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  # O build recebe código do PR sem segredos. O deploy fica em cf-preview-deploy.yml.
  preview:
    needs: decide
    if: needs.decide.outputs.rodar == 'true' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do código não confiável do PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Cloudflare sem segredos
        env:
          CS_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build:cf
      - name: Guarda apenas os assets compilados
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf-preview-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true


  # Publica um marcador para o workflow confiável não confundir build pulado com sucesso.
  skip:
    needs: decide
    if: needs.decide.outputs.rodar == 'false' || github.event.pull_request.draft == true || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cria marcador de preview pulado
        run: |
          printf 'preview pulado: nenhum arquivo do site mudou ou PR não publicável\n' > "$RUNNER_TEMP/preview-skip.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf-preview-skip-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-skip.txt
