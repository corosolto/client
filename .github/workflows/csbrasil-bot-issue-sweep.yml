name: csbrasil-bot-issue-sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review-open-issues:
    runs-on: ubuntu-latest
    if: ${{ secrets.CSBRASIL_BOT_TOKEN != '' }}
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure labels exist
        run: python3 scripts/ci/ensure_labels.py bot-fixable covered-by-pr crash-auto stale-backlog needs-repro
      - name: Fetch open issues and PRs
        run: |
          gh issue list --state open --limit 200 --json number,title,body,url,labels > /tmp/issues.json
          gh pr list --state open --limit 100 --json number,title,url,body > /tmp/prs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "issues": json.loads(Path('/tmp/issues.json').read_text()),
              "prs": json.loads(Path('/tmp/prs.json').read_text()),
          }
          Path('/tmp/issue-sweep-input.json').write_text(json.dumps(payload))
          PY
      - name: Compute sweep actions
        run: python3 scripts/ci/issue_sweep.py < /tmp/issue-sweep-input.json > /tmp/issue-sweep-actions.json
      - name: Apply labels and comments
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          actions = json.loads(Path('/tmp/issue-sweep-actions.json').read_text())['actions']
          for action in actions:
              number = str(action['issue_number'])
              labels = action.get('labels_add', [])
              if labels:
                  subprocess.run(['gh', 'issue', 'edit', number, '--add-label', ','.join(labels)], check=True)
              if action.get('should_comment'):
                  subprocess.run(['gh', 'issue', 'comment', number, '--body', action['comment']], check=True)
          PY
