name: csbrasil-bot-daily-release

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Optional UTC date for the release PR title (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: daily-release-staging-main
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Guard bot identity
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CSBRASIL_BOT_TOKEN is required to create and update the daily release PR."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Ensure release labels
        run: python3 scripts/ci/ensure_labels.py release release-batch release-hotfix hotfix bugfix
      - name: Plan the daily batch
        env:
          DATE: ${{ inputs.date || '' }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          gh api "repos/$REPO/pulls?state=open&base=main&head=$OWNER:staging" > /tmp/release-existing.json
          gh pr list --repo "$REPO" --state merged --base staging --limit 200 \
            --json number,mergeCommit > /tmp/release-merged.json
          DATE="$DATE" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lines = subprocess.check_output([
              'git', 'log', '--format=%H%x09%s', 'origin/main..origin/staging',
          ], text=True).splitlines()
          commits = [dict(zip(('sha', 'subject'), line.split('\t', 1))) for line in lines]
          payload = {
              'date': os.environ['DATE'],
              'commits': commits,
              'merged_prs': json.loads(Path('/tmp/release-merged.json').read_text()),
              'existing_prs': json.loads(Path('/tmp/release-existing.json').read_text()),
          }
          Path('/tmp/release-input.json').write_text(json.dumps(payload))
          PY
          python3 scripts/ci/daily_release.py --selftest
          python3 scripts/ci/daily_release.py < /tmp/release-input.json > /tmp/release-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/release-plan.json').read_text())
          Path('/tmp/release-title.txt').write_text(plan.get('title', ''))
          Path('/tmp/release-body.md').write_text(plan.get('body', ''))
          Path('/tmp/release-action.txt').write_text(plan['action'])
          Path('/tmp/release-number.txt').write_text(str(plan.get('pr_number', '')))
          PY
      - name: Create or update the single release PR
        run: |
          set -euo pipefail
          ACTION=$(cat /tmp/release-action.txt)
          if [ "$ACTION" = skip ]; then
            echo "staging has no commits outside main; no release PR needed"
            exit 0
          fi
          TITLE=$(cat /tmp/release-title.txt)
          if [ "$ACTION" = update ]; then
            NUMBER=$(cat /tmp/release-number.txt)
            gh pr edit "$NUMBER" --repo "$REPO" --title "$TITLE" \
              --body-file /tmp/release-body.md --add-label release
            echo "updated daily release PR #$NUMBER"
          else
            gh pr create --repo "$REPO" --base main --head "$OWNER:staging" \
              --title "$TITLE" --body-file /tmp/release-body.md --label release
          fi
