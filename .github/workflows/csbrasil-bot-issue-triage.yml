name: csbrasil-bot-issue-triage

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN || github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Ensure labels exist
        run: python3 scripts/ci/ensure_labels.py crash-auto bot-fixable covered-by-pr
      - name: Classify issue
        id: triage
        run: |
          gh issue view "$ISSUE_NUMBER" --json number,title,url,labels,body,author,state > /tmp/issue.json
          python3 scripts/ci/issue_triage.py < /tmp/issue.json > /tmp/triage.json
          cat /tmp/triage.json
      - name: Apply labels
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.load(open('/tmp/triage.json'))
          labels = data.get('labels_add', [])
          if labels:
              subprocess.run(['gh', 'issue', 'edit', os.environ['ISSUE_NUMBER'], '--add-label', ','.join(labels)], check=True)
          PY
      - name: Review issue and comment
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          issue = json.load(open('/tmp/issue.json'))
          prs = json.loads(subprocess.check_output([
              'gh', 'pr', 'list', '--state', 'open', '--limit', '100',
              '--json', 'number,title,url,body'
          ], text=True))
          pathlib.Path('/tmp/issue-review-input.json').write_text(json.dumps({'issue': issue, 'prs': prs}))
          PY
          python3 scripts/ci/issue_review.py < /tmp/issue-review-input.json > /tmp/issue-review.json
          python3 - <<'PY'
          import json, os, subprocess
          data = json.load(open('/tmp/issue-review.json'))
          labels = data.get('labels_add', [])
          if labels:
              subprocess.run(['gh', 'issue', 'edit', os.environ['ISSUE_NUMBER'], '--add-label', ','.join(labels)], check=True)
          body = data['comment']
          subprocess.run(['gh', 'issue', 'comment', os.environ['ISSUE_NUMBER'], '--body', body], check=True)
          PY
      - name: Suggest crash duplicate
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          current = json.load(open('/tmp/issue.json'))
          title = current['title'].lower()
          if not title.startswith('crash em produção:'):
              raise SystemExit(0)
          out = subprocess.check_output([
              'gh', 'issue', 'list', '--state', 'open', '--limit', '100',
              '--json', 'number,title,url,labels'
          ], text=True)
          data = json.loads(out)
          pathlib.Path('/tmp/crashes.json').write_text(json.dumps({
              'current': current,
              'others': data,
          }))
          PY
          python3 scripts/ci/crash_dedupe.py < /tmp/crashes.json > /tmp/dup.json
          python3 - <<'PY'
          import json, os, subprocess
          dup = json.load(open('/tmp/dup.json')).get('duplicate')
          if not dup:
              raise SystemExit(0)
          body = (
              "> [!TIP]\n"
              "> **Possível duplicata detectada automaticamente.**\n"
              "> \n"
              f"> - candidata: **#{dup['number']}** — {dup['title']}\n"
              f"> - similaridade: **{dup['score']}**\n"
              f"> - comparar: {dup['url']}\n"
              "\n"
              "Sugestão de bot — o fechamento continua sendo humano."
          )
          subprocess.run([
              'gh', 'issue', 'comment', os.environ['ISSUE_NUMBER'],
              '--body', body
          ], check=True)
          PY
