# autofix — o bot conserta o MECÂNICO e deixa o PR pronto. Ele NÃO mergeia.
#
# POR QUE EXISTE (medido em 21/08/2026, nos últimos 29 PRs): nenhum bot deste
# repositório jamais commitou um conserto. O #405 ficou vermelho por
# `DOCS1: documentação DESATUALIZADA`, cujo conserto é `npm run docs` mais um
# commit — trabalho sem julgamento nenhum, que hoje ou espera um mantenedor ou
# devolve o PR para o autor.
#
# A TRAVA: `scripts/ci/autofix_allowlist.py`. O bot só commita se TUDO que ele
# mexeu for arquivo gerado. Encostou em qualquer outro caminho, aborta e comenta.
# Sem essa lista, o primeiro conserto errado reescreve o mapa de um colaborador e
# ninguém repara — e a confiança de todo mundo de fora vai junto.
#
# `pull_request_target` porque é o único gatilho que enxerga secret em PR de fork
# (ver a régua WSEC1). O checkout é do MERGE do PR e roda apenas ferramentas do
# repositório base sobre ele — nunca `npm run` de script vindo do fork.
name: autofix

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a consertar
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autofix-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.CSBRASIL_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Guard de identidade
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CSBRASIL_BOT_TOKEN ausente — autofix não roda, e não reprova ninguém por isso."
            echo "pular=1" >> "$GITHUB_ENV"
          fi

      - name: Dados do PR
        if: env.pular != '1'
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRefName,headRepository,headRepositoryOwner,maintainerCanModify > /tmp/pr.json
          {
            echo "HEAD_REF=$(jq -r .headRefName /tmp/pr.json)"
            echo "HEAD_REPO=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' /tmp/pr.json)"
            echo "PODE_EDITAR=$(jq -r .maintainerCanModify /tmp/pr.json)"
          } >> "$GITHUB_ENV"

      # Checa o código do PR para poder REGERAR a doc a partir dele. Nada do fork é
      # executado: os geradores abaixo são os do repositório base, restaurados logo
      # depois do checkout.
      - name: Checkout do PR
        if: env.pular != '1'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_REF }}
          token: ${{ secrets.CSBRASIL_BOT_TOKEN }}
          fetch-depth: 0

      # As ferramentas que vão rodar têm de ser as da BASE, nunca as do fork — senão
      # um PR malicioso reescreve o gerador e o bot executa o que ele mandar.
      - name: Restaura as ferramentas da base
        if: env.pular != '1'
        run: |
          git remote add base "https://github.com/$REPO.git" 2>/dev/null || true
          git fetch --depth=1 base "${{ github.event.pull_request.base.ref || 'main' }}"
          git checkout FETCH_HEAD -- tools/ scripts/ package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.pular != '1'
        with: { node-version: 22 }
      - name: Instala dependências
        if: env.pular != '1'
        run: npm ci --ignore-scripts

      - name: Conserta o mecânico
        if: env.pular != '1'
        run: |
          node tools/gen-docs.mjs   || echo "::warning::gen-docs falhou"
          node tools/gen-arch.mjs   || echo "::warning::gen-arch falhou"

      # As ferramentas foram restauradas da base só para rodar; o que volta ao PR é
      # apenas o resultado delas.
      - name: Devolve as ferramentas ao estado do PR
        if: env.pular != '1'
        run: git checkout HEAD -- tools/ scripts/ package.json

      - name: A trava — só arquivo gerado pode virar commit
        if: env.pular != '1'
        id: trava
        run: |
          git status --porcelain > /tmp/mexidos.txt
          if [ ! -s /tmp/mexidos.txt ]; then
            echo "nada=1" >> "$GITHUB_OUTPUT"
            echo "PR já está em dia — nada a consertar."
            exit 0
          fi
          if ! python3 scripts/ci/autofix_allowlist.py < /tmp/mexidos.txt > /tmp/permitidos.txt; then
            cat /tmp/permitidos.txt
            echo "bloqueado=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commitar=1" >> "$GITHUB_OUTPUT"

      - name: Comenta quando a trava bloqueia
        if: env.pular != '1' && steps.trava.outputs.bloqueado == '1'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🤖 **autofix**: o conserto encostou em arquivo fora da lista de permissão, então **não commitei nada**. Rode \`npm run docs && node tools/gen-arch.mjs\` e confira o que mudou."

      - name: Empurra o conserto
        if: env.pular != '1' && steps.trava.outputs.commitar == '1' && env.PODE_EDITAR == 'true'
        run: |
          git config user.name  "csbrasil-bot"
          git config user.email "csbrasil-bot@users.noreply.github.com"
          xargs -a /tmp/permitidos.txt -r git add --
          git commit -m "chore(docs): regenera bloco derivado (autofix)" \
                     -m "Rodado pelo autofix: só arquivo gerado, conferido pela lista de permissão." \
                     -m "Signed-off-by: csbrasil-bot <csbrasil-bot@users.noreply.github.com>"
          git push origin "HEAD:$HEAD_REF"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🤖 **autofix**: regenerei os blocos derivados e empurrei o commit. O PR não precisa de mais nada disso."

      # Fork com "allow edits by maintainers" desligado: o bot não tem como empurrar.
      # Comentar o comando é melhor que um vermelho que o autor não entende.
      - name: Sem permissão de push — comenta o comando
        if: env.pular != '1' && steps.trava.outputs.commitar == '1' && env.PODE_EDITAR != 'true'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🤖 **autofix**: dá para consertar sozinho, mas este PR está com *allow edits by maintainers* desligado. Rode \`npm run docs && node tools/gen-arch.mjs\` e commite — ou ligue a opção e eu faço."
