name: cf-staging-deploy

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: cf-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baixa pacote de áudio privado
        env:
          AUDIO_PACK_URL: ${{ vars.AUDIO_PACK_URL }}
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/fetch-audio.sh --prefetch-r2
      # O token existe só nesta etapa e na publicação. O build consome o cache verificado,
      # sem acesso ao R2 nem a qualquer segredo.
      - name: Build Cloudflare
        id: build
        env:
          AUDIO_PACK_URL: ${{ vars.AUDIO_PACK_URL }}
          AUDIO_PACK_SHA256: ${{ vars.AUDIO_PACK_SHA256 }}
        run: |
          set -euo pipefail
          CS_BUILD_SHA="$(git rev-parse HEAD)"
          echo "sha=$CS_BUILD_SHA" >> "$GITHUB_OUTPUT"
          CS_BUILD_SHA="$CS_BUILD_SHA" npm run build:cf
      - name: Envia versão candidata de csb-staging
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CS_BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          npx wrangler triggers deploy --config wrangler.staging.toml
          npx wrangler versions upload \
            --config wrangler.staging.toml \
            --message "staging $CS_BUILD_SHA" 2>&1 | tee "$RUNNER_TEMP/wrangler-staging-upload.log"
          VERSION_ID=$(grep 'Worker Version ID:' "$RUNNER_TEMP/wrangler-staging-upload.log" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' | tail -n 1)
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/wrangler-staging-upload.log" | tail -n 1 | sed 's/[),.]$//')
          [ -n "$VERSION_ID" ] && [ -n "$URL" ] || {
            echo "::error::Wrangler não retornou ID e URL da versão candidata"
            exit 1
          }
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare staging candidato" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verifica versão candidata (build, áudio e viewmodels)
        env:
          CS_BUILD_SHA: ${{ steps.build.outputs.sha }}
          CANDIDATE_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          node tools/cf/verifica-deploy.mjs --base="$CANDIDATE_URL" --sha="$CS_BUILD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Promove versão verificada para csb-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          npx wrangler versions deploy "$VERSION_ID@100%" \
            --config wrangler.staging.toml \
            --yes
