name: Setup Playwright Chromium
description: >-
  Installs the Chromium pinned by the repository's locked Playwright (resolved from the root
  node_modules — no npm global) and exports a validated CHROME_BIN. Requires the root
  dependencies to be installed first (pnpm install --frozen-lockfile).
runs:
  using: composite
  steps:
    - name: Configure Playwright browser path
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

    - name: Playwright travado no lock (resolvido do node_modules do repo)
      shell: bash
      run: |
        set -euo pipefail
        test -x node_modules/.bin/playwright || { echo "::error::instale as dependências do client antes desta action"; exit 1; }
        node --input-type=commonjs <<'NODE'
        const { readFileSync } = require('node:fs');
        const { parse } = require('yaml');
        const lock = parse(readFileSync('pnpm-lock.yaml', 'utf8'));
        const expected = lock.importers['.'].devDependencies.playwright.version;
        const installed = require('playwright/package.json').version;
        if (installed !== expected) throw new Error(`Playwright instalado ${installed}; lock exige ${expected}`);
        NODE

    - name: Instala Chromium + libs do sistema
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Resolve CHROME_BIN (Chromium do Playwright)
      shell: bash
      run: |
        set -euo pipefail
        BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
        test -x "$BIN" || { echo "::error::CHROME_BIN não resolveu para um executável: [$BIN]"; exit 1; }
        echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
        printf 'CHROME_BIN=%s\n' "$BIN"
