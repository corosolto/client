name: Shared pr-fast environment
description: Restores the dependencies installed and the dist built by the setup job.
runs:
  using: composite
  steps:
    - name: Restore shared node_modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: node_modules
        key: pr-fast-node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
        fail-on-cache-miss: true

    - name: Download shared dist
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: pr-fast-dist-${{ github.run_id }}
        path: .

    - name: Validate shared environment
      shell: bash
      run: |
        set -euo pipefail
        test -x node_modules/.bin/astro || { echo '::error::shared node_modules is incomplete'; exit 1; }
        test -f dist/client/index.html || { echo '::error::shared dist is incomplete'; exit 1; }
        test -d .vercel/output/functions || { echo '::error::shared Vercel functions are incomplete'; exit 1; }
