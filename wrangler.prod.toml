# Produção do site no Cloudflare Workers (docs/runbooks/MIGRACAO-CLOUDFLARE.md, fases 4–6).
# Os hosts entram por Worker Route fora deste arquivo (tools/cf/virada.sh): www no csb-prod, apex
# csbrasil.online no csb-apex (tools/cf/apex). Estático não invoca o Worker: só a home roda antes.
name = "csb-prod"
main = "dist/server/entry.mjs"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = ["/", "/index.html"]

[observability]
enabled = true

# Texto, não segredo. Segredos (API_PROXY_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, X_PIXEL_TOKEN) por `wrangler secret put`.
[vars]
PUBLIC_API_BASE = "https://csbrasil-backend-hupd3weo5q-rj.a.run.app"
RANKING_ON = "true"

# Viewmodel vem no build como asset estático (deploy baixa do R2); o binding é só o reserva de src/cf/borda.mjs.
[[r2_buckets]]
binding = "PRIVADO"
bucket_name = "corosolto-private"
