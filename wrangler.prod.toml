# Produção do site no Cloudflare Workers (docs/runbooks/MIGRACAO-CLOUDFLARE.md, fases 4–6).
# Os hosts (www.corosolto.com.br, www.csbrasil.online, csbrasil.online) entram por Worker Route
# fora deste arquivo (tools/cf/virada.sh): ligar e desligar a virada não depende de deploy.
name = "csb-prod"
main = "dist/server/entry.mjs"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = true

[observability]
enabled = true

# Texto, não segredo. Segredos (API_PROXY_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, X_PIXEL_TOKEN) por `wrangler secret put`.
[vars]
PUBLIC_API_BASE = "https://csbrasil-backend-hupd3weo5q-rj.a.run.app"
RANKING_ON = "true"

# Viewmodel autorado (arte privada) servido pelo Worker a partir do R2; ver src/cf/borda.mjs.
[[r2_buckets]]
binding = "PRIVADO"
bucket_name = "corosolto-private"
