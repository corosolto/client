<div id="map-screen" class="screen hidden">
  <!-- A preview em tela cheia saiu do palco (decisão do dono, 21/08): a tela 04 virou
       LISTA + FICHA, não cartaz. O <img> continua no DOM porque o render e a sonda de
       tela leem o `src` pra saber qual mapa está em foco — `.ms-bg` fica display:none. -->
  <div class="ms-bg"><img id="ms-bg-img" alt=""></div>
  <div class="ms-scrim" aria-hidden="true"></div>
  <div class="ms-topbar">
    <div class="ms-kicker">04 · ESCOLHA DO MAPA</div>
    <div class="ms-tabs" id="ms-tabs" role="tablist" aria-label="Categorias de mapa">
      <button class="ms-tab on" data-cat="TODOS" type="button" role="tab" aria-selected="true">TODOS</button>
      <button class="ms-tab" data-cat="ARENA" type="button" role="tab" aria-selected="false">ARENA</button>
      <button class="ms-tab" data-cat="FAVELA" type="button" role="tab" aria-selected="false">FAVELA</button>
      <button class="ms-tab" data-cat="CIDADES" type="button" role="tab" aria-selected="false">CIDADES</button>
      <button class="ms-tab" data-cat="COMUNIDADE" type="button" role="tab" aria-selected="false">COMUNIDADE</button>
    </div>
    <p id="ms-cat-desc" class="ms-cat-desc" aria-live="polite"></p>
    <div id="ms-authors" class="ms-authors" hidden></div>
  </div>
  <!-- duas colunas: ficha à esquerda (texto menor, mais respiro), acervo à direita -->
  <div class="ms-body">
    <header class="ms-head">
      <div class="ms-tagrow"><span class="ms-cat" id="ms-cat">ARENA</span><span class="ms-count" id="ms-count"></span></div>
      <h2 id="ms-name" class="ms-name"> - </h2>
      <p id="ms-meta" class="ms-meta"></p>
      <p id="ms-desc" class="ms-desc"></p>
      <p id="ms-byline" class="ms-byline"></p>
      <div id="ms-match-options" class="ms-match-options" aria-label="Opções da partida">
        <label><span>ARMAS</span>
          <select id="ms-wpn-mode">
            <option value="all">TODAS</option><option value="pistols">SÓ PISTOLAS</option>
            <option value="knife">SÓ FACA</option><option value="awp">SÓ AWP</option>
          </select>
        </label>
        <label><span>JOGADORES</span>
          <select id="ms-players">
            <option value="2">2 × 2</option><option value="3">3 × 3</option>
            <option value="4">4 × 4</option><option value="5">5 × 5</option>
            <option value="6">6 × 6</option><option value="7">7 × 7</option>
            <option value="8">8 × 8</option>
          </select>
        </label>
        <label><span>Nº DE ROUNDS</span>
          <select id="ms-rounds">
            <option value="1">1</option><option value="3">3</option>
            <option value="5">5</option><option value="7">7</option>
          </select>
        </label>
      </div>
      <div class="ms-foot">
        <button id="ms-back" class="btn btn-back" type="button">◀ VOLTAR</button>
        <div class="ms-actions">
          <button id="ms-continue" class="btn btn-big" type="button"><span>CONTINUAR ▶</span></button>
        </div>
      </div>
    </header>
    <!-- coluna do acervo: rola na VERTICAL; as setas continuam sendo prev/next do mesmo
         estado que ← e → movem, então elas apontam pra cima e pra baixo aqui. -->
    <div class="ms-carousel">
      <button id="ms-prev" class="ms-arrow" type="button" aria-label="Mapa anterior">▲</button>
      <div class="ms-viewport"><div class="ms-strip" id="ms-strip"></div></div>
      <button id="ms-next" class="ms-arrow" type="button" aria-label="Próximo mapa">▼</button>
      <div class="ms-dashes" id="ms-dashes" aria-hidden="true"></div>
    </div>
  </div>
</div>
