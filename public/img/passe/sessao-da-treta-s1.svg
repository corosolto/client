<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <!-- Procedência: vetor escrito à mão neste repositório para o anúncio do passe (PR do passe, 10/11/2026); sem imagem externa nem geração por IA. Troque por arte final da temporada quando houver. -->
  <title>Sessão da Treta, temporada 1: barras de cor e chiado de TV fora do ar</title>
  <defs>
    <filter id="chiado" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .9  0 0 0 0 .9  0 0 0 0 .9  0 0 0 1.6 -.55"/>
    </filter>
    <linearGradient id="vinheta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090704" stop-opacity=".1"/>
      <stop offset=".72" stop-color="#090704" stop-opacity=".35"/>
      <stop offset="1" stop-color="#090704" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#b4d92e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b4d92e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tela"><rect x="620" y="170" width="360" height="270" rx="28"/></clipPath>
  </defs>
  <rect width="1600" height="700" fill="#0e0b07"/>
  <g>
    <rect x="0" width="229" height="470" fill="#c0c0c0"/>
    <rect x="229" width="229" height="470" fill="#c0c000"/>
    <rect x="458" width="228" height="470" fill="#00c0c0"/>
    <rect x="686" width="228" height="470" fill="#00c000"/>
    <rect x="914" width="228" height="470" fill="#c000c0"/>
    <rect x="1142" width="229" height="470" fill="#c00000"/>
    <rect x="1371" width="229" height="470" fill="#0000c0"/>
    <rect x="0" y="470" width="229" height="60" fill="#0000c0"/>
    <rect x="229" y="470" width="229" height="60" fill="#131313"/>
    <rect x="458" y="470" width="228" height="60" fill="#c000c0"/>
    <rect x="686" y="470" width="228" height="60" fill="#131313"/>
    <rect x="914" y="470" width="228" height="60" fill="#00c0c0"/>
    <rect x="1142" y="470" width="229" height="60" fill="#131313"/>
    <rect x="1371" y="470" width="229" height="60" fill="#c0c0c0"/>
    <rect x="0" y="530" width="400" height="170" fill="#00214c"/>
    <rect x="400" y="530" width="400" height="170" fill="#ffffff"/>
    <rect x="800" y="530" width="400" height="170" fill="#32006a"/>
    <rect x="1200" y="530" width="400" height="170" fill="#131313"/>
  </g>
  <rect width="1600" height="700" filter="url(#chiado)" opacity=".55"/>
  <rect y="300" width="1600" height="26" fill="#f0f0ed" opacity=".18"/>
  <rect y="338" width="1600" height="8" fill="#f0f0ed" opacity=".12"/>
  <rect width="1600" height="700" fill="url(#vinheta)"/>
  <ellipse cx="800" cy="320" rx="520" ry="300" fill="url(#brilho)"/>
  <g stroke="#131313" stroke-width="14" stroke-linecap="round">
    <path d="M800 168 700 52"/>
    <path d="M800 168 912 40"/>
  </g>
  <circle cx="700" cy="52" r="14" fill="#131313"/>
  <circle cx="912" cy="40" r="14" fill="#131313"/>
  <rect x="580" y="140" width="440" height="330" rx="44" fill="#131313"/>
  <g clip-path="url(#tela)">
    <rect x="620" y="170" width="360" height="270" fill="#26221b"/>
    <rect x="620" y="170" width="360" height="270" filter="url(#chiado)"/>
    <rect x="620" y="282" width="360" height="22" fill="#b4d92e" opacity=".55"/>
  </g>
  <rect x="620" y="170" width="360" height="270" rx="28" fill="none" stroke="#090704" stroke-width="6"/>
  <rect x="650" y="470" width="40" height="44" rx="6" fill="#131313"/>
  <rect x="910" y="470" width="40" height="44" rx="6" fill="#131313"/>
</svg>
