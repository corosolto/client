<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Viewmodel composto — bancada</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#93a8b7;font:14px system-ui;color:#fff}
    canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;left:14px;top:14px;padding:10px 12px;background:#101820cc;border:1px solid #ffffff33;border-radius:8px}
  </style>
</head>
<body>
  <div id="hud"></div>
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js?h=919693a84f08","three/addons/":"./vendor/addons/"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { createAuthoredViewModels, authoredVmFovForAspect } from './js/authoredvm.js';
    import { byId } from './js/characters.js';

    const q = new URLSearchParams(location.search);
    const weapon = q.get('weapon') || 'ak';
    const character = q.get('character') || 'mandrake';
    const clipName = q.get('clip') || 'idle';
    const debug = q.get('debug') === '1';
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xdcecff, 0x25313a, 2.3));
    const key = new THREE.DirectionalLight(0xfff1dc, 3.5); key.position.set(-2, 3, 4); scene.add(key);
    const camera = new THREE.PerspectiveCamera(67.38, 1.5, 0.005, 10);
    const root = new THREE.Group(); scene.add(root);
    const def = byId(character);
    const pal = def?.pal || { skin: 0xd19a72, shirt: 0x27364a };
    const authored = createAuthoredViewModels(root, async () => {
      await authored.ensureSkin(weapon);
      authored.setWeapon(weapon);
      if (clipName === 'reload') authored.reload(weapon, 2.1);
      else if (clipName === 'shoot') authored.shoot(weapon);
      const entry = authored.entry(weapon);
      const mounted = entry?.skins.get(weapon);
      if (q.get('donor') === '1') entry?.weaponMeshes.forEach((mesh) => {
        mesh.visible = true;
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        for (const material of materials) { material.wireframe = true; material.color?.set(0xff1744); }
      });
      const scale = mounted?.visual?.scale.x || 0;
      const action = entry?.action?.getClip()?.name?.split('-').at(-1) || '';
      const p = mounted?.object?.position || new THREE.Vector3();
      const g = entry?.anchor.grip || new THREE.Vector3();
      const c = entry?.anchor.sampledContact || new THREE.Vector3();
      root.updateWorldMatrix(true, true);
      const box = mounted?.visual ? new THREE.Box3().setFromObject(mounted.visual) : new THREE.Box3();
      const size = box.getSize(new THREE.Vector3());
      const identity = `${weapon} próprio · animação CC0 · pele/roupa ${character}`;
      document.querySelector('#hud').textContent = debug
        ? `${identity} · ação ${action} · span ${entry?.anchor.span.toFixed(3)} · escala ${scale.toExponential(2)} · grip ${g.toArray().map(v=>v.toFixed(3))} · contato ${c.toArray().map(v=>v.toFixed(3))} · pivot ${p.toArray().map(v=>v.toFixed(3))} · bbox ${size.toArray().map(v=>v.toExponential(2))}`
        : identity;
    }, { id: character, skin: pal.skin, sleeve: pal.shirt, accent: pal.pants });
    // Bancada auditável: permite provar no navegador, sem depender de screenshots, que
    // cada ID monta sua arma própria e mantém toda aparência doadora invisível.
    window.__authoredViewer = { authored, root, weapon, character };
    const clock = new THREE.Clock();
    function size(){
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.fov = authoredVmFovForAspect(camera.aspect);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', size); size();
    renderer.setAnimationLoop(() => { authored.update(clock.getDelta()); renderer.render(scene, camera); });
  </script>
</body>
</html>
