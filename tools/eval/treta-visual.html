<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRETA$ — validação visual local</title><link rel="stylesheet" href="/treta.css"><style>body{margin:0;background:#101b32;color:white;font-family:Arial;padding:20px}header{display:flex;justify-content:space-between;border-bottom:1px solid #526783;padding-bottom:20px}button{padding:12px;border:1px solid #dabd52;background:#233d61;color:white;cursor:pointer}h1{font-size:28px}main{max-width:700px;margin:50px auto}#purchase{height:230px;width:100%}output{color:#ffd572;display:block;margin:20px 0}</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script><header><b>CORO SOLTO · TRETA$</b><button id="hub-treta-wallet" class="treta-header-wallet"><span>T$</span><b id="hub-treta-total">T$ 0</b></button></header><main><small>TESTE VISUAL LOCAL · CRÉDITOS SIMULADOS</small><h1>Recompensas na tela</h1><p>Usa os módulos reais da loja e as moedas exportadas do Blender. Não credita nenhuma conta.</p><button id="mp">Concluir multiplayer · +T$25</button> <button id="friend">Amigo na treta · +T$100</button> <button id="email">Email confirmado · +T$200</button><output id="result"></output><h2>Compra · T$800 = 4 × T$200</h2><button id="buy">Reproduzir animação de compra</button><div id="purchase"></div></main><aside id="treta-earned" class="treta-earned" hidden aria-label="Recompensa TRETA$" role="status" aria-live="polite"><div id="treta-earned-coin" class="treta-earned-coin"></div><div><small id="treta-earned-reason"></small><strong id="treta-earned-value"></strong><span>ADICIONADOS À CARTEIRA</span></div><button id="treta-earned-close" type="button" aria-label="Fechar aviso de recompensa">✕</button></aside><script type="module">import {initTretaRewards,updateTretaRewards} from '/js/treta-rewards.js';import {TretaStage} from '/js/treta-stage.js';initTretaRewards();let balance=0,ledger=[],stage=null;function reward(kind,amount){balance+=amount;ledger.unshift({id:crypto.randomUUID(),kind,amount});updateTretaRewards({authenticated:true,accountId:'visual-test-'+location.search,wallet:{balance},ledger});document.getElementById('result').textContent='Teste: saldo '+balance+' T$';}document.getElementById('mp').onclick=()=>reward('multiplayer',25);document.getElementById('friend').onclick=()=>reward('referral',100);document.getElementById('email').onclick=()=>reward('email',200);document.getElementById('buy').onclick=async()=>{stage?.dispose();stage=new TretaStage(document.getElementById('purchase'),{coin:true,celebrate:true,count:4});await stage.load('/models/treta/coin-200.glb');};</script></html>
