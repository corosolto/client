# Preview por PR da migração Vercel -> Cloudflare Workers.
# Mantém os bindings do spike, mas usa uma publicação por versão.
name = "csb-preview"
main = "dist/server/entry.mjs"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "none"
html_handling = "drop-trailing-slash"
run_worker_first = ["/", "/index.html"]

[observability]
enabled = true

[vars]
PUBLIC_API_BASE = "https://csbrasil-backend-hupd3weo5q-rj.a.run.app"
RANKING_ON = "true"
